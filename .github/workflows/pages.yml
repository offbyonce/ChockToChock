#
# Builds the site with `just site` and publishes apps/web/dist to GitHub Pages.
# Runs on every push to main and on demand.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job can only read the repo. Only the deploy job
# gets the Pages and OIDC token permissions that deploy-pages needs.
permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `just site` builds the WebAssembly module and the packs with Rust.
      - name: Rust (version and targets from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # wasm-bindgen must be the same version as the crate pinned in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.130

      # pnpm first (version from package.json "packageManager"), so setup-node can find it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: just site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
