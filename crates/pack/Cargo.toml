[package]
name = "pack"
description = "Aircraft and library packs: manifest, YAML loading, validation and schema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
checklist-core = { workspace = true, features = ["schema"] }
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# Adds TypeScript type export for the flattened pack; app-core turns this on for the bindings.
ts = ["dep:ts-rs", "checklist-core/ts"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
