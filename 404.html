<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Involo has moved</title>
    <!-- Published from the repository with the old name. GitHub Pages serves this file for every
         path under /ChockToChock/ (there is no index.html), so one file covers them all. -->
    <script>
      (function () {
        var OLD = "/ChockToChock";
        var NEW = "/involo";
        var path = location.pathname;
        var rest = path.indexOf(OLD) === 0 ? path.slice(OLD.length) : path;
        location.replace(NEW + (rest || "/") + location.search + location.hash);
      })();
    </script>
    <!-- Without script: the new front page (path and query can't be kept without script). -->
    <meta http-equiv="refresh" content="0; url=/involo/">
    <link rel="canonical" href="https://offbyonce.github.io/involo/">
    <style>
      :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1218; color: #e6e9ee; }
      @media (prefers-color-scheme: light) { body { background: #f5f7fa; color: #1a1f27; } a { color: #1d4fd8; } }
      a { color: #7fb0ff; }
      p { max-width: 32rem; padding: 0 16px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <p>Chock to Chock is now Involo. You're being taken to its new address,
      <a href="/involo/">offbyonce.github.io/involo</a>. Your saved progress moves with you.</p>
  </body>
</html>
