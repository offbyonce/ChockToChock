#
# cargo-deny: licenses, security advisories, banned crates and allowed sources.
# Run with `just deny` (part of `just ci`).

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and yanked crates. Unmaintained-crate notices only fail for
# crates we depend on directly; deep Linux GUI dependencies of Tauri are outside our control.
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = [
    # glib 0.18 is pulled in only on Linux, by Tauri's GTK 0.18 stack, and the fix needs glib 0.20.
    # Neither our code nor those dependencies use VariantStrIter. Revisit on Tauri upgrades.
    { id = "RUSTSEC-2024-0429", reason = "Linux-only via Tauri's GTK 0.18 stack; VariantStrIter is unused; revisit on Tauri upgrades" },
]

[licenses]
# Permissive licenses only. GPL-family licenses are not allowed in the app.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
