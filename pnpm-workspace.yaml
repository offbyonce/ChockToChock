# SPDX-License-Identifier: MIT
packages:
  - apps/desktop/ui
  - packages/*

# Every JS dependency version lives here, once. Packages write "catalog:".
catalog:
  "@biomejs/biome": 2.6.6
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@tauri-apps/api": 2.12.4
  "@tauri-apps/cli": 2.12.4
  "@testing-library/svelte": 5.4.2
  jsdom: 31.0.0
  lefthook: 2.2.2
  svelte: 5.57.3
  svelte-check: 4.7.8
  typescript: 6.0.3
  vite: 8.3.6
  vitest: 5.1.0

# Supply-chain guard: never install a version published less than a day ago.
minimumReleaseAge: 1440

# Packages allowed to run install scripts (lefthook installs its git hooks).
allowBuilds:
  lefthook: true
