# yaml-language-server: $schema=../../schemas/checklist.schema.json
# Invented content that shows the pack format. Not a real aircraft procedure.
id: before-start
title: Before start
kind: checklist
basis: [invented-example]
steps:
  - id: example-trainer.before-start.battery
    number: 1
    text: Battery switch
    expect: 'ON'
    controls: [battery]
    quick: always
    why: Gives the aircraft its first electrical power.
    check: Voltage shown on the gauge
    if_not: No voltage
    if_not_detail: Check the battery is connected
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-08

  - id: example-trainer.before-start.beacon
    number: 2
    text: Beacon light
    expect: 'ON'
    note: Turn on before engine start.
    simulator_model: true
    callout: Beacon on.
    show_if: {option: power, equals: external}

  - id: example-trainer.before-start.doors
    number: 3
    section: Cabin
    text: Doors
    expect: CLOSED
    show_if:
      any_of:
        - {option: power, one_of: [external, internal]}
        - {option: start, equals: turnaround}
    panel_lights:
      battery: [BATT LOW]
    sim_simplified: true
