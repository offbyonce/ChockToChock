# Invented content that shows the pack format. Not a real aircraft procedure.
walkthroughs:
  - id: example-setup
    title: Example set-up
    pages:
      - page: PERF
        key: INIT
        title: Enter the fuel
        action:
          - 'Type '
          - {field: fuel_thousands, empty: the planned fuel}
          - ' and press 1L.'
        check:
          - when_known: [zfw]
            show: [Your weight is shown.]
            otherwise: [Enter your weight.]
        note:
          - Weights are in thousands of
          - {field: weight_unit, before: ' ', after: ., empty: ' pounds.'}
        screen:
          title: [PERF]
          page: ['1/1']
          highlight: [1L]
          scratchpad:
            - {field: fuel_thousands}
          rows:
            - left_label: [FUEL]
              left:
                - {field: fuel_thousands, style: user, empty: '□□□.□', empty_style: data}
              right_label: [RUNWAY]
              right:
                - when_known: [runway]
                  show:
                    - '<SEL> '
                    - {field: runway, before: RW, style: user}
                  otherwise:
                    - {text: (list of runways), style: data}
            - {}
            - separator: ''
              left: ['<INDEX']
              right:
                - {text: 'DONE>', style: accent}
