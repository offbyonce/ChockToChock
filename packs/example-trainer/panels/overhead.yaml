# Invented content that shows the pack format. Not a real aircraft procedure.
id: overhead
title: Overhead panel
width: 400
height: 200
sections:
  - id: electrical
    title: Electrical
    x: 10
    y: 10
    width: 180.5
    height: 90
    items:
      - kind: toggle_switch
        label: BATTERY
        guarded: true
        x: 20
        y: 30
        controls: [battery]
        positions: 'OFF, ON'
        description: Connects the battery.
      - kind: light
        label: BATT LOW
        color: amber
        x: 66.25
        y: 30
        controls: [battery]
        description: The battery is running low.
      - kind: display_unit
        label: VOLTS
        x: 110
        y: 30
        description: Shows battery voltage.
        width: 50
        height: 20
