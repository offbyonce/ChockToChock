# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: cruise-cruise
title: Cruise
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.cruise.cruise-altitude
    number: 1
    text: CRUISE ALTITUDE
    expect: VERIFY LEVEL AND MODES
    controls:
      - fma
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
    note: "Confirm the airplane has leveled, and read the FMA."
    why: Confirms the capture
    check: Level at cruise
    check_detail: FMA correct
  - id: ifly-737-max8.cruise.fuel
    number: 2
    text: FUEL
    expect: "CONFIRM ENOUGH TO REACH THE DESTINATION"
    controls:
      - fuelq
    targets:
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
    note: "Compare fuel used with your plan, and check the tanks stay balanced."
    why: Catches a problem early
    check: "PROGRESS page fuel at the destination above reserves"
    check_detail: Tanks balanced
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.cruise.center-fuel-pumps
    number: 3
    text: CENTER FUEL PUMPS
    expect: OFF WHEN BOTH LOW PRESSURE LIGHTS COME ON
    controls:
      - fuelpumps
    targets:
      - at: "oh/fuel/LOW PRESSURE/1"
        light: on
      - at: "oh/fuel/LOW PRESSURE/2"
        light: on
      - at: "oh/fuel/CTR L/1"
        set: "OFF"
      - at: "oh/fuel/CTR R/1"
        set: "OFF"
    quick: always
    note: Switch them off when the center tank is empty. Running them dry is a safety risk.
    why: Running pumps dry is a safety risk
    check: Both lights on first
    if_not: One light on
    if_not_detail: Leave both center pumps ON until both LOW PRESSURE lights are on
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.cruise.anti-ice
    number: 4
    text: ANTI-ICE
    expect: "AS REQUIRED, OFF PROMPTLY AFTER ICING, NOT IN DRY AIR"
    controls:
      - aice
    targets:
      - at: "oh/aice/WING ANTI-ICE/1"
        set: "OFF"
      - at: "oh/aice/ENG 1/1"
        set: "OFF"
      - at: "oh/aice/ENG 2/1"
        set: "OFF"
    quick: always
    note: Engine anti-ice ON in icing conditions (TAT 10C or below with visible moisture). Turn it off once you are clear of icing.
    why: Long use in dry air can overheat the inlet
  - id: ifly-737-max8.cruise.weather
    number: 5
    text: WEATHER
    expect: "MONITOR, IF SHOWN ON ND"
    controls:
      - efispanel
    targets:
      - at: "gl/efisl/MINS/1"
      - at: "gl/efisl/BARO/1"
      - at: "gl/efisl/MODE/1"
      - at: "gl/efisl/RANGE/1"
      - at: "gl/efisl/WXR/1"
      - at: "gl/efisl/TERR/1"
      - at: "gl/efisl/POS/1"
      - at: "gl/efisl/STA/1"
      - at: "gl/efisl/WPT/1"
      - at: "gl/efisl/ARPT/1"
      - at: "gl/efisr/MINS/1"
      - at: "gl/efisr/BARO/1"
      - at: "gl/efisr/MODE/1"
      - at: "gl/efisr/RANGE/1"
      - at: "gl/efisr/WXR/1"
      - at: "gl/efisr/TERR/1"
      - at: "gl/efisr/POS/1"
      - at: "gl/efisr/STA/1"
      - at: "gl/efisr/WPT/1"
      - at: "gl/efisr/ARPT/1"
    note: "Look ahead for weather on the ND, and plan any deviation early."
    why: Plan any deviation early
    panel_lights:
      efispanel:
        - WXR
  - id: ifly-737-max8.cruise.approach-preparation
    number: 6
    text: APPROACH PREPARATION
    expect: COMPLETE
    controls:
      - brefp
    why: "Weather, runway, chart and notices"
  - id: ifly-737-max8.cruise.descent-and-arrival-data
    number: 7
    text: DESCENT AND ARRIVAL DATA
    expect: ENTER IN CDU
    controls:
      - fmc
    targets:
      - at: "con/cdul/CDU/1"
      - at: "con/cdur/CDU/1"
    quick: always
    why: The FMC needs the arrival to plan the descent
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.cruise.mcp-altitude
    number: 8
    text: MCP ALTITUDE
    expect: "SET THE CLEARED ALTITUDE WHEN CLEARED TO DESCEND"
    controls:
      - mcpalt
    targets:
      - at: "gl/mcp/ALTITUDE/1"
    quick: always
    why: VNAV will not descend below the MCP altitude
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
