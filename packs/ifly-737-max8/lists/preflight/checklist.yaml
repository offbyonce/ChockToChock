# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: preflight-preflight-checklist
title: Preflight checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.preflight.oxygen
    text: OXYGEN
    expect: "TESTED, 100%"
    controls:
      - oxym
      - mask
    targets:
      - at: "seat/side/MASK STOWAGE/1"
      - at: "seat/side/RESET/TEST/1"
      - at: "seat/side/NORMAL/100%/1"
        set: "100%"
    why: Needed at once in a decompression or smoke
    how: crew
    explain: crew
  - id: ifly-737-max8.preflight.navigation-transfer-and-display-switches
    text: NAVIGATION TRANSFER AND DISPLAY SWITCHES
    expect: "NORMAL, SOURCE AUTO"
    terms: ["P5"]
    controls:
      - navsw
      - dispsw
    targets:
      - at: "oh/nav/VHF NAV/1"
        set: "NORMAL"
      - at: "oh/nav/IRS/1"
        set: "NORMAL"
      - at: "oh/nav/FMC/1"
        set: "NORMAL"
      - at: "oh/disp/SOURCE/1"
        set: "AUTO"
      - at: "oh/disp/CONTROL PANEL/1"
        set: "NORMAL"
    why: Each side uses its own source
    check: All NORMAL
    check_detail: SOURCE AUTO
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.window-heat
    text: WINDOW HEAT
    expect: "ON"
    terms: ["window heat", "P5", "probe heat"]
    controls:
      - wheat
    targets:
      - at: "oh/heat/L SIDE/1"
        set: "ON"
      - at: "oh/heat/L FWD/1"
        set: "ON"
      - at: "oh/heat/R FWD/1"
        set: "ON"
      - at: "oh/heat/R SIDE/1"
        set: "ON"
    why: "Heated windows resist ice and fogging, and warm windshield panels are more resistant to bird strikes."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.pressurization-mode-selector
    text: PRESSURIZATION MODE SELECTOR
    expect: AUTO
    terms: ["FLT ALT", "LAND ALT", "P5"]
    controls:
      - press
    targets:
      - at: "oh/press/MODE/1"
        set: "AUTO"
    why: Cabin pressure follows FLT ALT and LAND ALT
    panel_lights:
      press:
        - MODE
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.flight-instruments
    text: FLIGHT INSTRUMENTS
    expect: HEADING ___ ALTIMETER ___
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    fill:
      - manual
      - qnh
    why: Confirms the instruments before flight
    check: Heading and altimeter agree
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.parking-brake-check
    text: PARKING BRAKE
    expect: SET
    controls:
      - pbrake
    targets:
      - at: "con/lo/PARKING BRAKE/1"
        set: "SET"
      - at: "con/lo/PARK BRAKE LIGHT/1"
        light: on
    why: Holds the airplane while parked
    check: Parking brake light ON
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.engine-start-levers-check
    text: ENGINE START LEVERS
    expect: CUTOFF
    controls:
      - slever
    targets:
      - at: "con/lo/START LEVER 1/1"
        set: "CUTOFF"
      - at: "con/lo/START LEVER 2/1"
        set: "CUTOFF"
    note: Cutoff stops fuel to the engines until you are ready to start.
    why: No fuel until you are ready to start
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
