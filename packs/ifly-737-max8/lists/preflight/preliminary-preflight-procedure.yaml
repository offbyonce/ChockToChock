#
# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: preflight-preliminary-preflight-procedure
title: Preliminary preflight procedure
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.preflight.panel-and-flood-lights
    text: PANEL AND FLOOD LIGHTS
    expect: AS NEEDED
    controls:
      - panellts
    targets:
      - at: "mn/clt/MAIN PANEL/1"
      - at: "mn/clt/BACKGROUND/1"
      - at: "mn/clt/AFDS FLOOD/1"
      - at: "mn/gp/MAIN PANEL/1"
    why: "Comfortable lighting for the rest of the preflight, especially at night"
    check: Panels readable and lights not glaring
  - id: ifly-737-max8.preflight.irs
    number: 1
    text: IRS
    expect: BOTH NAV
    controls:
      - irs
    targets:
      - at: "aft/irs/IRS L/1"
        set: "NAV"
      - at: "aft/irs/IRS R/1"
        set: "NAV"
    quick: always
    why: Must align while the airplane is still
    how: irs
    explain: irs
    timer:
      seconds: 600
      label: IRS alignment
      note: A typical time. The ALIGN light going out is what counts.
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.elt-switch
    number: 2
    text: ELT SWITCH
    expect: "GUARD CLOSED, LIGHT OUT"
    controls:
      - elt
    targets:
      - at: "aft/elt/ELT/1"
        light: out
      - at: "aft/elt/ELT SWITCH/1"
    note: "The iFly does not simulate the ELT. The switch and light only respond to clicks."
    why: Stops an accidental distress signal
    check: Guard closed
    check_detail: Light OUT
    simulator_model: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.elevator-jam-landing-assist
    number: 3
    text: ELEVATOR JAM LANDING ASSIST
    expect: "GUARD CLOSED, LIGHTS OUT"
    controls:
      - elevjam
    targets:
      - at: "aft/jam/ASSIST ON/1"
        light: out
      - at: "aft/jam/ELEV JAM LANDING ASSIST/1"
    why: Not simulated in the iFly. Just confirm the guard is closed and the lights are out
    not_simulated: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.gps-ils-gls-and-maint-lights
    number: 4
    text: "GPS, ILS, GLS AND MAINT LIGHTS"
    expect: OUT
    controls:
      - gpslts
    targets:
      - at: "aft/irs/GPS/1"
        light: out
      - at: "aft/irs/ILS/1"
        light: out
      - at: "aft/irs/GLS/1"
        light: out
      - at: "aft/mnt/MAINT/1"
        light: out
    why: "A lit light means a GPS, ILS, GLS or maintenance fault"
    check: "GPS, ILS, GLS and MAINT OUT"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.eec-switches
    number: 5
    text: EEC SWITCHES
    expect: "ON, ENGINE CONTROL, REVERSER LIMITED, REVERSER COMMAND AND REVERSER AIR/GRD LIGHTS OUT"
    controls:
      - eec
    targets:
      - at: "aft/eng/REVERSER LIMITED/1"
        light: out
      - at: "aft/eng/ENGINE CONTROL/1"
        light: out
      - at: "aft/eng/REVERSER LIMITED/2"
        light: out
      - at: "aft/eng/ENGINE CONTROL/2"
        light: out
      - at: "aft/eng/EEC 1/1"
        set: "ON"
      - at: "aft/eng/EEC 2/1"
        set: "ON"
      - at: "aft/eng/REVERSER COMMAND/1"
        light: out
      - at: "aft/eng/REVERSER AIR/GRD/1"
        light: out
    note: "The electronic engine control protects the engine limits. Check that both show ON, with no ALTN light."
    why: Protects the engine limits
    check: Both EEC buttons show ON
    check_detail: "No ALTN shown"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.passenger-oxygen-switch
    number: 6
    text: PASSENGER OXYGEN SWITCH
    expect: "GUARD CLOSED, PASS OXY ON LIGHT OUT"
    controls:
      - paxoxy
    targets:
      - at: "aft/oxy/PASS OXYGEN/1"
      - at: "aft/oxy/PASS OXY ON/1"
        light: out
    note: Check that the guard is closed so the cabin masks cannot be dropped by accident.
    why: Stops cabin masks dropping by accident
    check: Guard closed
    check_detail: PASS OXY ON light OUT
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.crew-oxygen-pressure
    number: 7
    text: CREW OXYGEN PRESSURE
    expect: SUFFICIENT FOR THE FLIGHT
    controls:
      - crewoxy
    targets:
      - at: "aft/oxy/CREW OXYGEN/1"
    why: Needed at once in a decompression or smoke
    check: Crew oxygen pressure read on the gauge
    check_detail: Enough for the flight
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.landing-gear-indicator-lights-ovhd
    number: 8
    text: LANDING GEAR INDICATOR LIGHTS (OVHD)
    expect: "3 GREEN"
    controls:
      - gearovhd
    targets:
      - at: "aft/gear/LEFT GEAR/1"
        light: on
      - at: "aft/gear/RIGHT GEAR/1"
        light: on
      - at: "aft/gear/NOSE GEAR/1"
        light: on
    why: "Second set of lights, green is down and locked"
    check: "3 green lights"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.flight-recorder-switch
    number: 9
    text: FLIGHT RECORDER SWITCH
    expect: GUARD CLOSED
    controls:
      - fltrec
    targets:
      - at: "aft/rec/FLIGHT RECORDER/1"
    why: Recorder runs automatically
    check: Guard closed
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.mach-airspeed-warning-test
    number: 10
    text: MACH AIRSPEED WARNING TEST
    expect: "TEST EACH, CLACKER SOUNDS"
    controls:
      - mach
    targets:
      - at: "aft/rec/MACH TEST 1/1"
      - at: "aft/rec/MACH TEST 2/1"
    why: The clacker warns when you exceed the maximum operating speed (VMO/MMO)
    check: Clacker sounds
    check_detail: For each switch
    how: mach
    explain: mach
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.stall-warning-test
    text: STALL WARNING TEST
    expect: "TEST EACH, COLUMN SHAKES"
    controls:
      - stalltest
    targets:
      - at: "aft/stall/STALL TEST 1/1"
      - at: "aft/stall/STALL TEST 2/1"
    why: Stick shaker warns of an approaching stall
    how: stall
    explain: stall
  - id: ifly-737-max8.preflight.manual-gear-extension-access-door
    number: 11
    text: MANUAL GEAR EXTENSION ACCESS DOOR
    expect: CLOSED
    controls:
      - mangear
    why: Covers the manual gear release handles
    check: Door closed
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.cdu
    number: 12
    text: CDU
    expect: PROGRAM FOR FLIGHT
    controls:
      - cdu
    targets:
      - at: "con/cdul/CDU/1"
      - at: "con/cdur/CDU/1"
    opens: preflight-setup
    quick: always
    why: "Route, performance, N1 limit and takeoff reference"
    check: "Route, performance, N1 limit and TAKEOFF REF pages complete"
    how: cdu
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.flight-control-switches
    number: 13
    section: Overhead panel
    text: FLIGHT CONTROL SWITCHES
    expect: "A ON, B ON, GUARDS CLOSED"
    controls:
      - fltctrl
    targets:
      - at: "oh/fctl/FLT CONTROL A/1"
        set: "A ON"
      - at: "oh/fctl/FLT CONTROL B/1"
        set: "B ON"
    note: These give hydraulic power to the flight controls. Both must be on for flight.
    why: Hydraulic power to the flight controls
    check: LOW PRESSURE lights ON
    check_detail: Normal until hydraulic pressure is up
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.spoiler-switches
    number: 14
    text: SPOILER SWITCHES
    expect: "ON, GUARDS CLOSED"
    controls:
      - spoilsw
    targets:
      - at: "oh/fctl/SPOILER A/1"
        set: "ON"
      - at: "oh/fctl/SPOILER B/1"
        set: "ON"
    why: Hydraulic power to the flight spoilers
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.yaw-damper-switch
    number: 15
    text: YAW DAMPER SWITCH
    expect: "ON, LIGHT OUT"
    controls:
      - yawd
    targets:
      - at: "oh/fctl/YAW DAMPER/1"
        light: out
      - at: "oh/fctl/YAW DAMPER/2"
        set: "ON"
    quick: always
    note: Check that the amber YAW DAMPER light goes out. The yaw damper engages only with the B FLT CONTROL switch ON.
    why: Must be on for flight
    check: YAW DAMPER light OUT
    if_not: Light stays on
    if_not_detail: Check the B FLT CONTROL switch is ON. The yaw damper engages only then
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.standby-hydraulic-lights
    number: 16
    text: STANDBY HYDRAULIC LIGHTS
    expect: OUT
    controls:
      - stbyhyd
    targets:
      - at: "oh/fctl/LOW QUANTITY/1"
        light: out
      - at: "oh/fctl/LOW PRESSURE/1"
        light: out
      - at: "oh/fctl/STBY RUD ON/1"
        light: out
    why: A lit light means a standby hydraulic fault
    check: "LOW QUANTITY, LOW PRESSURE and STBY RUD ON OUT"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.alternate-flaps-switches
    number: 17
    text: "ALTERNATE FLAPS MASTER AND POSITION SWITCHES"
    expect: "MASTER OFF, GUARD CLOSED, POSITION OFF"
    controls:
      - altflap
    targets:
      - at: "oh/fctl/ALT FLAPS MASTER/1"
        set: "OFF"
      - at: "oh/fctl/ALT FLAPS/1"
        set: "OFF"
    why: "Electric flap backup, off in normal use"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.feel-diff-press-speed-trim-fail-mach-trim-fail
    number: 18
    text: "FEEL DIFF PRESS, SPEED TRIM FAIL, MACH TRIM FAIL, AUTO SLAT FAIL AND SPOILERS LIGHTS"
    expect: OUT
    controls:
      - fctllts
    targets:
      - at: "oh/fctl/FEEL DIFF PRESS/1"
        light: out
      - at: "oh/fctl/SPEED TRIM FAIL/1"
        light: out
      - at: "oh/fctl/MACH TRIM FAIL/1"
        light: out
      - at: "oh/fctl/AUTO SLAT FAIL/1"
        light: out
      - at: "oh/fctl/SPOILERS/1"
        light: out
    why: A lit light is a flight control fault to sort out before flight
    check: All five lights OUT
    panel_lights:
      fctllts:
        - FEEL DIFF PRESS
        - SPEED TRIM FAIL
        - MACH TRIM FAIL
        - AUTO SLAT FAIL
        - SPOILERS
    note: "The iFly does not model the FEEL DIFF PRESS light."
    simulator_model: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.navigation-transfer-switches
    number: 19
    text: NAVIGATION TRANSFER SWITCHES
    expect: "VHF NAV, IRS AND FMC NORMAL"
    controls:
      - navsw
    targets:
      - at: "oh/nav/VHF NAV/1"
        set: "NORMAL"
      - at: "oh/nav/IRS/1"
        set: "NORMAL"
      - at: "oh/nav/FMC/1"
        set: "NORMAL"
    why: Each side uses its own navigation source
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.display-source-switches
    number: 20
    text: DISPLAY SOURCE SWITCHES
    expect: "SOURCE AUTO, CONTROL PANEL NORMAL"
    controls:
      - dispsw
    targets:
      - at: "oh/disp/SOURCE/1"
        set: "AUTO"
      - at: "oh/disp/CONTROL PANEL/1"
        set: "NORMAL"
    why: "Each side's displays run from their own computer"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.fuel-valve-and-filter-lights
    text: "ENG VALVE CLOSED, SPAR VALVE CLOSED AND FILTER BYPASS LIGHTS"
    expect: "VALVE LIGHTS ON, FILTER BYPASS OUT"
    controls:
      - fuellts
    targets:
      - at: "oh/fuel/ENG VALVE CLOSED/1"
        light: on
      - at: "oh/fuel/SPAR VALVE CLOSED/1"
        light: on
      - at: "oh/fuel/ENG VALVE CLOSED/2"
        light: on
      - at: "oh/fuel/SPAR VALVE CLOSED/2"
        light: on
      - at: "oh/fuel/FILTER BYPASS/1"
        light: out
      - at: "oh/fuel/FILTER BYPASS/2"
        light: out
    why: "With the start levers in CUTOFF, both fuel valves should be shut."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.crossfeed-selector
    number: 21
    text: CROSSFEED SELECTOR
    expect: "CLOSED, VALVE OPEN LIGHT OUT"
    controls:
      - xfeed
    targets:
      - at: "oh/fuel/VALVE OPEN/1"
        light: out
      - at: "oh/fuel/CROSSFEED/1"
        set: "Closed"
    quick: turnaround
    why: Keeps the fuel sides separate
    check: VALVE OPEN light OUT
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.fuel-pump-switches
    number: 22
    text: FUEL PUMP SWITCHES
    expect: ALL OFF
    controls:
      - fuelpumps
    targets:
      - at: "oh/fuel/CTR L/1"
        set: "OFF"
      - at: "oh/fuel/CTR R/1"
        set: "OFF"
      - at: "oh/fuel/AFT 1/1"
        set: "OFF"
      - at: "oh/fuel/FWD 1/1"
        set: "OFF"
      - at: "oh/fuel/FWD 2/1"
        set: "OFF"
      - at: "oh/fuel/AFT 2/1"
        set: "OFF"
    show_if:
      any_of:
        - option: power
          equals: gpu
        - option: start
          equals: turn
    why: "Pumps stay off until Before start. If the APU is already running, the left forward pump stays on instead"
    check: "Center tank LOW PRESSURE lights OUT, main tank LOW PRESSURE lights ON"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.fuel-pump-switches-preliminary-prefligh
    text: "FUEL PUMP SWITCHES"
    expect: "ONE LEFT PUMP MAY BE ON FOR THE APU (OPTIONAL), OTHERS OFF"
    controls:
      - fuelpumps
    targets:
      - at: "oh/fuel/CTR L/1"
        set: "OFF"
      - at: "oh/fuel/CTR R/1"
        set: "OFF"
      - at: "oh/fuel/AFT 1/1"
      - at: "oh/fuel/FWD 1/1"
      - at: "oh/fuel/FWD 2/1"
        set: "OFF"
      - at: "oh/fuel/AFT 2/1"
        set: "OFF"
    show_if:
      all_of:
        - option: power
          equals: apu
        - option: start
          equals: cold
    why: "Optional. A left pump gives the running APU positive fuel pressure. The APU can also draw from the left tank by suction."
    check: "The running pump's LOW PRESSURE light OUT"
    check_detail: The other pumps come on in Before start
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.cab-util-and-ife-pass-seat-switches
    number: 23
    text: CAB/UTIL AND IFE/PASS SEAT SWITCHES
    expect: "ON"
    controls:
      - cabutil
    targets:
      - at: "oh/elecu/CAB/UTIL/1"
        set: "ON"
      - at: "oh/elecu/IFE/PASS SEAT/1"
        set: "ON"
    quick: always
    why: Power to galleys and seat equipment
    note: "In the iFly, only the cabin light function of CAB/UTIL is simulated."
    simulator_model: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.bat-discharge-tr-unit-and-elec-lights
    number: 24
    text: "BAT DISCHARGE, TR UNIT AND ELEC LIGHTS"
    expect: OUT
    controls:
      - eleclts
    targets:
      - at: "oh/elecu/BAT DISCHARGE/1"
        light: out
      - at: "oh/elecu/TR UNIT/1"
        light: out
      - at: "oh/elecu/ELEC/1"
        light: out
    why: A lit light is an electrical fault
    check: "BAT DISCHARGE, TR UNIT and ELEC OUT"
    panel_lights:
      eleclts:
        - BAT DISCHARGE
        - TR UNIT
        - ELEC
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.generator-drive-disconnect-switches
    number: 25
    text: GENERATOR DRIVE DISCONNECT SWITCHES
    expect: "GUARDS CLOSED, DRIVE LIGHTS ON BEFORE START"
    controls:
      - gendrive
    targets:
      - at: "oh/elecm/DRIVE 1/1"
        light: on
      - at: "oh/elecm/DRIVE 2/1"
        light: on
      - at: "oh/elecm/DISCONNECT 1/1"
      - at: "oh/elecm/DISCONNECT 2/1"
    note: Check that the guards are closed. The amber DRIVE lights are normal before start because the engines are not turning.
    why: The DRIVE lights are normal before start because the engines are not turning
    check: Guards closed
    check_detail: DRIVE lights ON
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.bus-transfer-switch
    text: BUS TRANSFER SWITCH
    expect: "AUTO, GUARD CLOSED"
    controls:
      - bustrans
    targets:
      - at: "oh/elecl/BUS TRANS/1"
        set: "AUTO"
    why: Transfer buses can switch source automatically
  - id: ifly-737-max8.preflight.engine-gen-off-bus-lights
    number: 26
    text: ENGINE GEN OFF BUS LIGHTS
    expect: "ON"
    controls:
      - genbus
    targets:
      - at: "oh/elecl/GEN OFF BUS/1"
        light: on
      - at: "oh/elecl/GEN OFF BUS/2"
        light: on
    note: "Confirm these blue lights are on. The engines are not running, so their generators cannot be powering the buses."
    why: "Engines not running, so no generator power"
    check: Blue lights ON
    panel_lights:
      genbus:
        - GEN OFF BUS
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.lavatory-smoke-light
    number: 27
    text: LAVATORY SMOKE LIGHT
    expect: OUT
    controls:
      - lavsmoke
    targets:
      - at: "oh/col/LAVATORY SMOKE/1"
        light: out
    why: Lit means a smoke detector has gone off
    check: Light OUT
    note: "The iFly does not simulate this light."
    simulator_model: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.equipment-cooling-switches
    number: 28
    text: EQUIPMENT COOLING SWITCHES
    expect: "NORM, OFF LIGHTS OUT"
    controls:
      - equip
    targets:
      - at: "oh/col/EQUIP OFF/1"
        light: out
      - at: "oh/col/EQUIP OFF/2"
        light: out
      - at: "oh/col/SUPPLY/1"
        set: "NORM"
      - at: "oh/col/EXHAUST/1"
        set: "NORM"
      - at: "oh/col/EQUIP SMOKE/1"
        light: out
    why: Avionics overheat without the fans
    check: OFF lights OUT
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.emergency-exit-lights-switch
    number: 29
    text: EMERGENCY EXIT LIGHTS SWITCH
    expect: "ARMED, GUARD CLOSED"
    controls:
      - emerext
    targets:
      - at: "oh/col/NOT ARMED/1"
        light: out
      - at: "oh/col/EMER EXIT LIGHTS/1"
        set: "ARMED"
    quick: always
    note: "The iFly does not simulate the exit lights themselves."
    why: Cabin exit lights come on if power is lost
    check: NOT ARMED light OUT
    simulator_model: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.passenger-signs
    number: 30
    text: PASSENGER SIGNS
    expect: "NO SMOKING AND FASTEN BELTS AUTO OR ON"
    controls:
      - signs
    targets:
      - at: "oh/col/NO SMOKING/1"
      - at: "oh/col/FASTEN BELTS/1"
    quick: always
    why: "Keeps the cabin signs working for the flight."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.window-heat-switches
    number: 31
    text: WINDOW HEAT SWITCHES
    expect: "ON"
    controls:
      - wheat
    targets:
      - at: "oh/heat/L SIDE/1"
        set: "ON"
      - at: "oh/heat/L FWD/1"
        set: "ON"
      - at: "oh/heat/R FWD/1"
        set: "ON"
      - at: "oh/heat/R SIDE/1"
        set: "ON"
    quick: always
    why: "Heats the windshields. A green ON light shows the heating is working."
    check: Green ON lights
    check_detail: OVERHEAT lights OUT
    if_not: OVERHEAT light on
    if_not_detail: "That window has overheated, or its heat power was interrupted"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.probe-heat
    number: 32
    text: PROBE HEAT
    expect: AUTO
    controls:
      - pheat
    targets:
      - at: "oh/heat/PROBE A/1"
        set: "AUTO"
      - at: "oh/heat/PROBE B/1"
        set: "AUTO"
    quick: always
    why: AUTO heats the probes when the engines run
    check: Amber probe lights stay on
    check_detail: Normal until an engine runs
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.preflight.engine-and-wing-anti-ice-switches
    number: 33
    text: ENGINE AND WING ANTI-ICE SWITCHES
    expect: "OFF"
    controls:
      - aice
    targets:
      - at: "oh/aice/WING ANTI-ICE/1"
        set: "OFF"
