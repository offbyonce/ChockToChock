# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: descent-descent-checklist
title: Descent checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.descent.pressurization
    text: PRESSURIZATION
    expect: LAND ALT ___
    controls:
      - ldgalt
    targets:
      - at: "oh/press/LAND ALT/1"
      - at: "oh/press/LAND ALT KNOB/1"
    fill:
      - landing_altitude
    why: Brings the cabin down to airport elevation
    check: LAND ALT matches the destination
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.descent.recall-check
    text: RECALL
    expect: CHECKED
    controls:
      - recall
    targets:
      - at: "gl/annl/FLT CONT/1"
      - at: "gl/annl/IRS/1"
      - at: "gl/annl/FUEL/1"
      - at: "gl/annl/ELEC/1"
      - at: "gl/annl/APU/1"
      - at: "gl/annl/OVHT/DET/1"
      - at: "gl/annr/ANTI-ICE/1"
      - at: "gl/annr/HYD/1"
      - at: "gl/annr/DOORS/1"
      - at: "gl/annr/ENG/1"
      - at: "gl/annr/OVERHEAD/1"
      - at: "gl/annr/AIR COND/1"
    why: Shows any stored system alerts
    check: No unexpected alerts
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.descent.autobrake-check
    text: AUTOBRAKE
    expect: "___"
    controls:
      - abrake
    targets:
      - at: "con/ed/AUTO BRAKE/1"
    fill:
      - autobrake
    why: "Pick by runway length and surface: lower settings on long dry runways, higher on short or wet ones"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.descent.landing-data
    text: LANDING DATA
    expect: "VREF ___, MINIMUMS ___"
    controls:
      - vref
      - mins
    targets:
      - at: "gl/efisl/MINS/1"
      - at: "gl/efisr/MINS/1"
      - at: "con/cdul/CDU/1"
      - at: "con/cdur/CDU/1"
    fill:
      - vref
      - minimums
    why: Confirms the landing data
    check: VREF and minimums set
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.descent.approach-briefing
    text: APPROACH BRIEFING
    expect: COMPLETE
    controls:
      - briefa
    why: "Chart, minimums, missed approach and the plan"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
