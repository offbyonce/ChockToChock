# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: after-takeoff-after-takeoff-checklist
title: After takeoff checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.after-takeoff.engine-bleeds
    text: ENGINE BLEEDS
    expect: "ON"
    controls:
      - engbleed
    targets:
      - at: "oh/bleed/ENG BLEED 1/1"
        set: "ON"
      - at: "oh/bleed/ENG BLEED 2/1"
        set: "ON"
    why: Bleed air into the pneumatic system
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-takeoff.pack-switches-check
    text: PACK SWITCHES
    expect: AUTO
    controls:
      - packs
    targets:
      - at: "oh/bleed/L PACK/1"
        set: "AUTO"
      - at: "oh/bleed/R PACK/1"
        set: "AUTO"
    why: Packs back in AUTO after a packs-off takeoff
    check: PACK lights OUT
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-takeoff.landing-gear
    text: LANDING GEAR
    expect: UP
    controls:
      - gearup
    targets:
      - at: "mn/ctr/LANDING GEAR LEVER/1"
        set: "UP"
    why: Gear up and locked
    check: Red and green gear lights OUT
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-takeoff.flaps
    text: FLAPS
    expect: "UP, NO LIGHTS"
    controls:
      - flaplever
    targets:
      - at: "con/st/FLAP LEVER/1"
        set: "UP"
    why: Clean for the climb
    check: Flaps UP
    check_detail: No leading edge flap lights (TRANSIT or EXT)
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
