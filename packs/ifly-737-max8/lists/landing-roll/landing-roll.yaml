# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: landing-roll-landing-roll
title: Landing roll
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.landing-roll.autopilot-and-autothrottle
    text: "AUTOPILOT AND AUTOTHROTTLE"
    expect: "DISCONNECT AFTER LANDING"
    why: "Leaves the rollout in your hands."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing-roll.thrust-levers
    number: 1
    text: THRUST LEVERS
    expect: VERIFY CLOSED
    terms: ["Spoilers"]
    controls:
      - thrust
    targets:
      - at: "con/st/THRUST LEVERS 1 AND 2/1"
    quick: always
    note: Confirm the levers are closed. The spoilers and autobrake rely on it.
    note_caution: true
    why: Spoilers and autobrake rely on it
    check: Levers closed
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing-roll.speedbrake
    number: 2
    text: SPEEDBRAKE
    expect: VERIFY UP
    terms: ["SPEEDBRAKE", "Spoilers"]
    controls:
      - speedbrake
    targets:
      - at: "con/st/SPEEDBRAKE LEVER/1"
        set: "UP"
    note: "Confirm the lever moved to UP. If it did not, raise it by hand."
    note_caution: true
    why: Spoilers slow you down
    check: Lever UP
    if_not: Not up
    if_not_detail: Raise it by hand
  - id: ifly-737-max8.landing-roll.reverse-thrust
    number: 3
    text: REVERSE THRUST
    expect: APPLY AS NEEDED
    controls:
      - thrust
    targets:
      - at: "con/st/THRUST LEVERS 1 AND 2/1"
    quick: always
    why: Slows you after landing
    check: REV green
    how: rev
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing-roll.rev-indications
    number: 4
    text: REV INDICATIONS
    expect: GREEN ON BOTH ENGINES
    controls:
      - engmon
    targets:
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "con/ed/ENG/1"
    note: Reversers are deployed when REV shows green.
    why: Reversers are deployed
    check: REV green on both engines
  - id: ifly-737-max8.landing-roll.60-knots
    number: 5
    text: "60 KNOTS"
    expect: "BEGIN STOWING THE REVERSERS"
    controls:
      - thrust
    targets:
      - at: "con/st/THRUST LEVERS 1 AND 2/1"
    note: Start reducing reverse so the engines reach reverse idle by taxi speed.
    note_caution: true
    why: Limits debris thrown up at low speed
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing-roll.reverse-levers
    number: 6
    text: REVERSE LEVERS
    expect: FULL DOWN BEFORE TAXI SPEED
    controls:
      - thrust
    targets:
      - at: "con/st/THRUST LEVERS 1 AND 2/1"
    quick: always
    note: Stow the reversers before you leave the runway.
    note_caution: true
    why: Stowed before you leave the runway
    check: Reversers stowed
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing-roll.autobrake
    number: 7
    text: AUTOBRAKE
    expect: DISARM BEFORE TAXI SPEED
    controls:
      - abrake
    targets:
      - at: "con/ed/AUTO BRAKE/1"
    note: "Set the selector to OFF (pressing the toe brakes also disarms it), then brake with the toe brakes."
    note_caution: true
    why: Take over with the toe brakes
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
