# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: before-taxi-before-taxi-checklist
title: Before taxi checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.before-taxi.generators
    text: GENERATORS
    expect: "ON"
    terms: ["P5"]
    controls:
      - engen
    targets:
      - at: "oh/elecl/GEN 1/1"
        set: "ON"
      - at: "oh/elecl/GEN 2/1"
        set: "ON"
    why: Engine generators take over the buses
    explain: gen
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.probe-heat-check
    text: PROBE HEAT
    expect: "ON, PROBE LIGHTS OUT"
    terms: ["probe heat", "P5"]
    controls:
      - pheat
    targets:
      - at: "oh/heat/PROBE A/1"
        set: "ON"
      - at: "oh/heat/PROBE B/1"
        set: "ON"
      - at: "oh/heat/CAPT PITOT/1"
        light: out
      - at: "oh/heat/L ELEV PITOT/1"
        light: out
      - at: "oh/heat/L ALPHA VANE/1"
        light: out
      - at: "oh/heat/TEMP PROBE/1"
        light: out
      - at: "oh/heat/F/O PITOT/1"
        light: out
      - at: "oh/heat/R ELEV PITOT/1"
        light: out
      - at: "oh/heat/R ALPHA VANE/1"
        light: out
      - at: "oh/heat/AUX PITOT/1"
        light: out
    why: "Heats the probes for flight. The lights go out once heating is working."
    check: "Both PROBE HEAT switches ON, probe lights OUT"
    check_detail: Amber probe lights out once an engine is running
    if_not: An amber probe light stays on with an engine running
    if_not_detail: That probe is not heating. Airspeed or Mach may be wrong in icing
    note: "ON starts heating straight away. AUTO starts it only once the engines are running."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.anti-ice-check
    text: ANTI-ICE
    expect: AS REQUIRED
    terms: ["anti-ice", "P5"]
    controls:
      - aice
    targets:
      - at: "oh/aice/WING ANTI-ICE/1"
      - at: "oh/aice/ENG 1/1"
      - at: "oh/aice/ENG 2/1"
    note: Turn ENG 1 and ENG 2 anti-ice ON when it is 10C or below with visible moisture. Otherwise leave them OFF.
    note_caution: true
    why: Stops ice building in the engine inlets on the ground
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.isolation-valve-switch-check
    text: ISOLATION VALVE SWITCH
    expect: AUTO
    terms: ["ISOLATION VALVE", "P5", "Bleed air"]
    controls:
      - iso
    targets:
      - at: "oh/bleed/ISOLATION VALVE/1"
        set: "AUTO"
    note: "AUTO closes the valve when both engine bleeds and both packs are on, and opens it if any of them is off."
    why: "Closes with both bleeds and packs on, opens if one is off"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.engine-start-switches-check
    text: ENGINE START SWITCHES
    expect: CONT
    terms: ["CONT", "P5"]
    controls:
      - starts
    targets:
      - at: "oh/start/ENGINE START 1/1"
        set: "CONT"
      - at: "oh/start/ENGINE START 2/1"
        set: "CONT"
    note: "CONT keeps the igniters firing, ready against a flameout on takeoff."
    why: Igniters ready against a flameout on takeoff
    panel_lights:
      starts:
        - ENGINE START 1
        - ENGINE START 2
  - id: ifly-737-max8.before-taxi.recall-check
    text: RECALL
    expect: CHECKED
    terms: ["RECALL", "P7"]
    controls:
      - recall
    targets:
      - at: "gl/annl/FLT CONT/1"
      - at: "gl/annl/IRS/1"
      - at: "gl/annl/FUEL/1"
      - at: "gl/annl/ELEC/1"
      - at: "gl/annl/APU/1"
      - at: "gl/annl/OVHT/DET/1"
      - at: "gl/annr/ANTI-ICE/1"
      - at: "gl/annr/HYD/1"
      - at: "gl/annr/DOORS/1"
      - at: "gl/annr/ENG/1"
      - at: "gl/annr/OVERHEAD/1"
      - at: "gl/annr/AIR COND/1"
    why: Shows any stored system alerts
    check: No unexpected alerts
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.autobrake
    text: AUTOBRAKE
    expect: RTO
    terms: ["autobrake", "RTO", "P9"]
    controls:
      - abrake
    targets:
      - at: "con/ed/AUTO BRAKE/1"
        set: "RTO"
    why: Maximum braking if you reject at high speed
    explain: aut
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.engine-start-levers
    text: ENGINE START LEVERS
    expect: IDLE DETENT
    controls:
      - slever
    targets:
      - at: "con/lo/START LEVER 1/1"
        set: "IDLE"
      - at: "con/lo/START LEVER 2/1"
        set: "IDLE"
    why: Fuel on to both engines
    check: Levers at IDLE detent
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.flight-controls-check
    text: FLIGHT CONTROLS
    expect: CHECKED
    controls:
      - fltcon
    why: A jam is safest found on the ground
    check: "Full, free movement"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-taxi.ground-equipment
    text: GROUND EQUIPMENT
    expect: "TOWING PIN REMOVED, EQUIPMENT CLEAR"
    terms: ["EFB"]
    controls:
      - grnd
    why: "Nothing may be left attached before taxi."
    check: "Towing pin removed in the EFB"
    check_detail: Equipment clear
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
