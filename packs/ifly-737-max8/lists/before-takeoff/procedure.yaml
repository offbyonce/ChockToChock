# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: before-takeoff-before-takeoff-procedure
title: Before takeoff procedure
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.before-takeoff.oil-temperature
    number: 1
    text: OIL TEMPERATURE
    expect: AT LEAST 31C
    controls:
      - oil
    targets:
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "con/ed/ENG/1"
    why: Needed before takeoff thrust
    check: Oil at least 31C
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-takeoff.efis-control-panels
    number: 2
    text: EFIS CONTROL PANELS
    expect: "TERRAIN DISPLAY AS DESIRED"
    terms: ["EFIS", "ND", "TERR", "P7"]
    controls:
      - efispanel
    targets:
      - at: "gl/efisl/TERR/1"
      - at: "gl/efisr/TERR/1"
    why: "Weather or terrain on the ND for the departure. Weather radar is not simulated in the iFly, so use TERR"
    panel_lights:
      efispanel:
        - WXR
        - TERR
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.before-takeoff.pack-switches
    text: PACK SWITCHES
    expect: AUTO OR OFF PER PERFORMANCE DATA
    terms: ["PACK", "P5", "Bleed air"]
    controls:
      - packs
    targets:
      - at: "oh/bleed/L PACK/1"
      - at: "oh/bleed/R PACK/1"
    why: The pack setting must match the one used in your preflight performance calculations
    check: Both PACK switches set for takeoff
    check_detail: "AUTO is normal. OFF when conditions warrant, to align with preflight performance calculations"
