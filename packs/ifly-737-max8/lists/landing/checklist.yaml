# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: landing-landing-checklist
title: Landing checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.landing.engine-start-switches
    text: ENGINE START SWITCHES
    expect: CONT
    terms: ["CONT"]
    controls:
      - starts
    targets:
      - at: "oh/start/ENGINE START 1/1"
        set: "CONT"
      - at: "oh/start/ENGINE START 2/1"
        set: "CONT"
    why: Ignition on for approach and landing
    panel_lights:
      starts:
        - ENGINE START 1
        - ENGINE START 2
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing.speedbrake-lever-check
    text: SPEEDBRAKE LEVER
    expect: ARMED
    terms: ["SPEEDBRAKE", "Spoilers"]
    controls:
      - speedbrake
    targets:
      - at: "mn/cl/SPEED BRAKE ARMED/1"
        light: on
      - at: "con/st/SPEEDBRAKE LEVER/1"
        set: "ARMED"
    why: Spoilers deploy on landing
    check: Green SPEED BRAKE ARMED light
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing.gear
    text: GEAR
    expect: "DOWN, 3 GREEN"
    controls:
      - gearlever
    targets:
      - at: "mn/ctr/LEFT GEAR/2"
        light: on
      - at: "mn/ctr/NOSE GEAR/2"
        light: on
      - at: "mn/ctr/RIGHT GEAR/2"
        light: on
      - at: "mn/ctr/LANDING GEAR LEVER/1"
        set: "DN"
    why: Gear down and locked
    check: "3 green lights"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing.flaps
    text: FLAPS
    expect: "___, GREEN LIGHT"
    controls:
      - flaplever
    targets:
      - at: "con/st/FLAP LEVER/1"
    fill:
      - landing_flaps
    why: Final landing configuration
    check: Flaps set
    check_detail: Green light
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.landing.landing-clearance-check
    text: LANDING CLEARANCE
    expect: OBTAINED
    controls:
      - clear
    targets:
      - at: "con/r1/VHF RADIO 1/1"
    note: Confirm you are cleared to land on this runway.
    note_caution: true
    why: Cleared to land on this runway
    check: Clearance received
