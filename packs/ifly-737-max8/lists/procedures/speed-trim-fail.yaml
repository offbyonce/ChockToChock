    number: 1
    text: SPEED TRIM AND MCAS
    expect: INOPERATIVE FOR THE REMAINDER OF THE FLIGHT
    controls:
      - fctllts
    targets:
      - at: "oh/fctl/LOW PRESSURE/2"
      - at: "oh/fctl/LOW PRESSURE/3"
      - at: "oh/fctl/FEEL DIFF PRESS/1"
      - at: "oh/fctl/SPEED TRIM FAIL/1"
      - at: "oh/fctl/MACH TRIM FAIL/1"
      - at: "oh/fctl/AUTO SLAT FAIL/1"
      - at: "oh/fctl/SPOILERS/1"
    panel_lights:
      fctllts:
        - SPEED TRIM FAIL
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.operation
    number: 2
    text: OPERATION
    expect: CONTINUE NORMAL OPERATION
    controls:
      - fctllts
    targets:
      - at: "oh/fctl/LOW PRESSURE/2"
      - at: "oh/fctl/LOW PRESSURE/3"
      - at: "oh/fctl/FEEL DIFF PRESS/1"
      - at: "oh/fctl/SPEED TRIM FAIL/1"
      - at: "oh/fctl/MACH TRIM FAIL/1"
      - at: "oh/fctl/AUTO SLAT FAIL/1"
      - at: "oh/fctl/SPOILERS/1"
    panel_lights:
      fctllts:
        - SPEED TRIM FAIL
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
