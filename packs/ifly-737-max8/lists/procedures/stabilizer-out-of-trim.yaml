# Imported from 3.0, then validated against official documents. Edit by hand; do not regenerate.
id: procedures-stabilizer-out-of-trim
title: Stabilizer out of trim
kind: non-normal
basis:
  - regulator-docs
steps:
  - id: ifly-737-max8.procedures.stab-out-of-trim-light-on-the-ground
    number: 1
    text: "ON THE GROUND: STAB OUT OF TRIM LIGHT"
    expect: DO NOT TAKE OFF
    controls:
      - stabout
    targets:
      - at: "mn/cl/STAB OUT OF TRIM/1"
        light: out
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.light-momentary-in-flight-stabilizer-trimming
    number: 2
    text: "LIGHT MOMENTARY IN FLIGHT, STABILIZER TRIMMING"
    expect: CONTINUE NORMAL OPERATION
    controls:
      - stabout
    targets:
      - at: "mn/cl/STAB OUT OF TRIM/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.in-flight-stabilizer-not-trimming
    number: 3
    text: "IN FLIGHT, STABILIZER NOT TRIMMING"
    expect: "HOLD COLUMN, DISENGAGE A/P AND A/T, USE MAIN ELECTRIC TRIM"
    controls:
      - column
    targets:
      - at: "seat/yoke/STAB TRIM/1"
      - at: "seat/yoke/A/P DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.if-stabilizer-responds-to-electric-trim
    number: 4
    text: IF STABILIZER RESPONDS TO ELECTRIC TRIM
    expect: DO NOT RE-ENGAGE A/P OR A/T
    controls:
      - apdis
    targets:
      - at: "gl/mcp/DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.if-the-stabilizer-does-not-respond
    number: 5
    text: IF THE STABILIZER DOES NOT RESPOND
    expect: GO TO STABILIZER TRIM INOPERATIVE
    controls:
      - stabwheel
    targets:
      - at: "con/st/STAB TRIM WHEEL/1"
      - at: "con/st/STAB TRIM WHEEL/2"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.light-on-after-landing
    number: 6
    text: LIGHT ON AFTER LANDING
    expect: THE FLIGHT CONTROL COMPUTER (FCC) TRIM MONITOR TRIPPED IN FLIGHT
    controls:
      - stabout
    targets:
      - at: "mn/cl/STAB OUT OF TRIM/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
