id: procedures-aoa-ias-and-alt-disagree
title: "AOA, IAS and ALT disagree"
kind: non-normal
basis:
  - regulator-docs
steps:
  - id: ifly-737-max8.procedures.aoa-disagree
    number: 1
    text: AOA DISAGREE
    expect: ACCOMPLISH AIRSPEED UNRELIABLE
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.ias-disagree
    number: 2
    text: IAS DISAGREE
    expect: ACCOMPLISH AIRSPEED UNRELIABLE
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.alt-disagree-with-ias-disagree
    number: 3
    text: ALT DISAGREE WITH IAS DISAGREE
    expect: ACCOMPLISH AIRSPEED UNRELIABLE
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.alt-disagree-alone
    number: 4
    text: ALT DISAGREE ALONE
    expect: "CHECK ALTIMETER SETTINGS. IF THE DISAGREE REMAINS, DO NOT USE THE FLIGHT PATH VECTOR, AND SELECT THE TRANSPONDER TO THE RELIABLE SIDE, OR ALTITUDE REPORTING OFF"
    controls:
      - xpndr
      - baro
    targets:
      - at: "con/atc/ALT SOURCE 1/1"
      - at: "con/atc/XPNDR/1"
      - at: "con/atc/MODE/1"
      - at: "con/atc/ALT SOURCE 2/1"
      - at: "gl/efisl/BARO/1"
      - at: "gl/efisr/BARO/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
