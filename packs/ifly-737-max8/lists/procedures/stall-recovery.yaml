# Imported from 3.0, then validated against official documents. Edit by hand; do not regenerate.
id: procedures-stall-recovery
title: Stall recovery
kind: non-normal
basis:
  - regulator-docs
steps:
  - id: ifly-737-max8.procedures.autopilot-and-autothrottle-stall-recovery
    number: 1
    text: AUTOPILOT AND AUTOTHROTTLE
    expect: "HOLD COLUMN FIRMLY, DISENGAGE BOTH"
    controls:
      - column
    targets:
      - at: "seat/yoke/STAB TRIM/1"
      - at: "seat/yoke/A/P DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.pitch
    number: 2
    text: PITCH
    expect: "LOWER THE NOSE UNTIL THE SHAKER AND BUFFET END, TRIMMING AS NEEDED"
    controls:
      - column
    targets:
      - at: "seat/yoke/STAB TRIM/1"
      - at: "seat/yoke/A/P DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.roll
    number: 3
    text: ROLL
    expect: "WINGS LEVEL THE SHORT WAY, IF NEEDED"
    controls:
      - column
    targets:
      - at: "seat/yoke/STAB TRIM/1"
      - at: "seat/yoke/A/P DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.thrust-and-speedbrakes
    number: 4
    text: THRUST AND SPEEDBRAKES
    expect: "ADVANCE THRUST, RETRACT SPEEDBRAKES"
    controls:
      - thrust
    targets:
      - at: "con/st/THRUST LEVERS 1 AND 2/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.gear-and-flaps-stall-recovery
    number: 5
    text: GEAR AND FLAPS
    expect: "NO CHANGE. EXCEPTION: IF THE STALL IS AT LIFTOFF WITH FLAPS UP, SET FLAPS 1"
    controls:
      - flaplever
    targets:
      - at: "con/st/FLAP LEVER/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.flight-path
    number: 6
    text: FLIGHT PATH
    expect: RE-ESTABLISH SPEED AND PITCH. NO FLIGHT DIRECTOR DURING RECOVERY
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
