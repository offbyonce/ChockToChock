# Imported from 3.0, then validated against official documents. Edit by hand; do not regenerate.
id: procedures-stabilizer-trim-inoperative
title: Stabilizer trim inoperative
kind: non-normal
basis:
  - regulator-docs
steps:
  - id: ifly-737-max8.procedures.stab-trim-cutout-switches-both
    number: 1
    text: STAB TRIM CUTOUT SWITCHES (BOTH)
    expect: CUTOUT
    controls:
      - stabcut
    targets:
      - at: "con/lo/STAB TRIM PRI/1"
      - at: "con/lo/STAB TRIM B/U/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.autopilot
    number: 2
    text: AUTOPILOT
    expect: DO NOT USE (NOT AVAILABLE)
    controls:
      - apdis
    targets:
      - at: "gl/mcp/DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.stabilizer
    number: 3
    text: STABILIZER
    expect: TRIM MANUALLY. TWO-PILOT EFFORT MAY BE USED
    controls:
      - stabwheel
    targets:
      - at: "con/st/STAB TRIM WHEEL/1"
      - at: "con/st/STAB TRIM WHEEL/2"
    note: "If ice could be the cause, descend to warmer air and try again."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.airspeed
    number: 4
    text: AIRSPEED
    expect: LOWER SPEED EASES MANUAL TRIM
    controls:
      - speedt
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.landing
    number: 5
    text: LANDING
    expect: "PLAN FLAPS 15 AND VREF 15 + 10 KT, ESTABLISH CONFIGURATION EARLY"
    controls:
      - flaplever
    targets:
      - at: "con/st/FLAP LEVER/1"
    note: "Keep any wind additive to 5 knots or less, and check the landing distance in an approved source."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.procedures.go-around
    number: 6
    text: GO-AROUND
    expect: ADVANCE THRUST SLOWLY
    controls:
      - thrust
    targets:
      - at: "con/st/THRUST LEVERS 1 AND 2/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
