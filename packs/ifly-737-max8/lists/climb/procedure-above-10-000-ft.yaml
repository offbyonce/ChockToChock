# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: climb-climb-procedure-above-10-000-ft
title: "Climb procedure, above 10,000 ft"
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.climb.center-fuel-pumps
    text: "CENTER FUEL PUMPS"
    expect: "OFF WHEN THE LOW PRESSURE LIGHTS COME ON"
    why: "The lights show the center tank is running out, so the pumps have nothing left to feed."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.climb.landing-lights
    number: 1
    text: LANDING LIGHTS
    expect: "OFF"
    controls:
      - landlt
    targets:
      - at: "oh/ltl/LANDING L/1"
        set: "OFF"
      - at: "oh/ltl/LANDING R/1"
        set: "OFF"
    quick: always
    note: "Above 10,000 ft they are no longer needed."
    why: "Not needed above 10,000 ft"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.climb.wing-logo-and-runway-turnoff-lights
    number: 2
    text: "WING, LOGO AND RUNWAY TURNOFF LIGHTS"
    expect: "OFF"
    controls:
      - winglt
      - logo
      - turnoff
    targets:
      - at: "oh/lte/LOGO/1"
        set: "OFF"
      - at: "oh/lte/WING/1"
        set: "OFF"
    why: Not needed in the climb
  - id: ifly-737-max8.climb.fasten-belts-selector
    number: 3
    text: FASTEN BELTS SELECTOR
    expect: AS DESIRED
    controls:
      - sblts
    targets:
      - at: "oh/col/FASTEN BELTS/1"
    why: Belts off in smooth air if you choose
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
