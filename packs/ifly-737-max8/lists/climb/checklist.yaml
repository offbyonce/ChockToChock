# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: climb-climb-checklist
title: Climb checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.climb.exterior-lights
    text: EXTERIOR LIGHTS
    expect: "LANDING, TURNOFF, WING AND LOGO OFF"
    controls:
      - landlt
      - turnoff
      - winglt
      - logo
    targets:
      - at: "oh/ltl/LANDING L/1"
        set: "OFF"
      - at: "oh/ltl/LANDING R/1"
        set: "OFF"
      - at: "oh/ltl/TURNOFF L/1"
        set: "OFF"
      - at: "oh/ltl/TURNOFF R/1"
        set: "OFF"
      - at: "oh/lte/LOGO/1"
        set: "OFF"
      - at: "oh/lte/WING/1"
        set: "OFF"
    why: Not needed in the climb
  - id: ifly-737-max8.climb.fasten-belts-selector-check
    text: FASTEN BELTS SELECTOR
    expect: AS DESIRED
    controls:
      - sblts
    targets:
      - at: "oh/col/FASTEN BELTS/1"
    why: Belts off in smooth air if you choose
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.climb.altimeters
    text: ALTIMETERS
    expect: STD AT TRANSITION ALTITUDE
    terms: ["TRANSITION ALTITUDE", "STD"]
    controls:
      - baro
    targets:
      - at: "gl/efisl/BARO/1"
        set: "STD"
      - at: "gl/efisr/BARO/1"
        set: "STD"
    hint:
      - prefix: "TRANS ALT "
        field: transition_altitude
    quick: always
    note: Pressing STD gives every airplane the same altitude reference above the transition altitude.
    why: Same altitude reference above transition
    how: baro
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
