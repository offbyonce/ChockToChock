id: before-taxi-before-taxi-procedure
title: Before taxi procedure
kind: flow
basis:
  - prior-release
steps:
  - id: ifly-737-max8.before-taxi.engine-generator-switches
    number: 1
    text: ENGINE GENERATOR SWITCHES
    expect: BOTH ON
    controls:
      - engen
    quick: always
    why: Engine generators take over the buses
    how: gens
    explain: gen
    status: draft
  - id: ifly-737-max8.before-taxi.probe-heat
    number: 2
    text: PROBE HEAT
    expect: VERIFY AUTO
    controls:
      - pheat
    quick: always
    why: AUTO heats the probes whenever an engine runs
    check: Both PROBE HEAT switches at AUTO
    check_detail: Amber probe lights out once an engine is running
    if_not: An amber probe light stays on with an engine running
    if_not_detail: That probe is not heating. Airspeed or Mach may be wrong in icing
    explain: pheat
    status: draft
  - id: ifly-737-max8.before-taxi.anti-ice
    number: 3
    text: ANTI-ICE
    expect: AS REQUIRED
    controls:
      - aice
    quick: always
    note: Turn ENG 1 and ENG 2 anti-ice ON when it is 10C or below with visible moisture. Otherwise leave them OFF.
    why: Stops ice building in the engine inlets on the ground
    status: draft
  - id: ifly-737-max8.before-taxi.pack-switches
    number: 4
    text: PACK SWITCHES
    expect: AUTO
    controls:
      - packs
    quick: always
    why: Supplies conditioned air to the cabin
    check: PACK lights OUT
    status: draft
  - id: ifly-737-max8.before-taxi.isolation-valve-switch
    number: 5
    text: ISOLATION VALVE SWITCH
    expect: AUTO
    controls:
      - iso
    quick: always
    note: "AUTO closes the valve when both engine bleeds and both packs are on, and opens it if any of them is off."
    why: "Closes with both bleeds and packs on, opens if one is off"
    status: draft
  - id: ifly-737-max8.before-taxi.engine-bleed-switches
    text: ENGINE BLEED SWITCHES
    expect: "ON"
    controls:
      - engbleed
    note: "With the APU bleed about to go off, the engines now supply the packs."
    why: Engines now supply the packs before the APU bleed goes off
    status: draft
  - id: ifly-737-max8.before-taxi.engine-start-switches
    text: ENGINE START SWITCHES
    expect: CONT
    controls:
      - starts
    quick: always
    note: "CONT keeps the igniters firing, ready against a flameout on takeoff."
    why: Igniters ready against a flameout on takeoff
    panel_lights:
      starts:
        - ENGINE START 1
        - ENGINE START 2
    status: draft
  - id: ifly-737-max8.before-taxi.apu-bleed-switch
    number: 6
    text: APU BLEED SWITCH
    expect: "OFF"
    controls:
      - apubleed
    quick: always
    why: Engine bleeds now supply the air
    status: draft
  - id: ifly-737-max8.before-taxi.apu-switch
    number: 7
    text: APU SWITCH
    expect: "OFF"
    controls:
      - apusw
    quick: always
    why: "Saves fuel, after the engine generators are on"
    explain: apuoff
    status: draft
  - id: ifly-737-max8.before-taxi.flap-lever
    number: 8
    text: FLAP LEVER
    expect: TAKEOFF FLAPS PER CDU AND PWB
    controls:
      - flaplever
    quick: always
    why: Takeoff performance depends on it. Use the flap setting from the CDU and the performance (PWB) sheet
    check: Flap indication matches
    check_detail: Green LE FLAPS EXT light
    if_not: Indication disagrees with the lever
    if_not_detail: Recheck the flaps before takeoff. The takeoff configuration warning may not catch a wrong setting
    explain: flp
    status: draft
  - id: ifly-737-max8.before-taxi.sys-switch
    number: 9
    text: SYS SWITCH
    expect: "PRESS, FLIGHT CONTROLS SHOWN"
    controls:
      - sysp
    note: "Shows flight control positions on the display, ready for your control check."
    why: Ready for your control check
    status: draft
  - id: ifly-737-max8.before-taxi.flight-controls
    number: 10
    text: FLIGHT CONTROLS
    expect: FULL AND FREE
    controls:
      - fltcon
    why: A jam is safest found on the ground
    how: fltctl
    explain: fltc
    status: draft
  - id: ifly-737-max8.before-taxi.recall
    number: 11
    text: RECALL
    expect: "PRESS, NO UNEXPECTED ALERTS"
    controls:
      - recall
    why: Shows any stored system alerts
    check: No unexpected alerts
    how: recall
    status: draft
