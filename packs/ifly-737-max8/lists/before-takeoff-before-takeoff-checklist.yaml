# yaml-language-server: $schema=../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: before-takeoff-before-takeoff-checklist
title: Before takeoff checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.before-takeoff.flaps
    text: FLAPS
    expect: "CDU ___, PWB ___, FLAPS ___ INDICATED, GREEN LIGHT"
    controls:
      - flaplever
    fill:
      - takeoff_flaps
      - takeoff_flaps
      - takeoff_flaps
    why: Must match the planned flaps
    check: "CDU, performance sheet (PWB) and flap indication agree"
    check_detail: Green light
    status: checked
  - id: ifly-737-max8.before-takeoff.takeoff-data
    text: TAKEOFF DATA
    expect: "SET, RUNWAY ___"
    controls:
      - cdu
    fill:
      - runway
    why: Confirms the takeoff reference
    check: Data and runway agree
    status: draft
  - id: ifly-737-max8.before-takeoff.v2
    text: V2
    expect: "___ SET"
    controls:
      - mcpset
    fill:
      - v2
    why: Target speed after liftoff
    check: V2 set on the MCP
    panel_lights:
      mcpset:
        - IAS/MACH
    status: draft
  - id: ifly-737-max8.before-takeoff.stabilizer-trim
    text: STABILIZER TRIM
    expect: "___ UNITS"
    controls:
      - stabind
    fill:
      - takeoff_trim
    why: Sets the pitch forces at rotation
    check: Trim matches the takeoff data
    check_detail: In the green band
    status: checked
