id: cold-dark-if-cold-and-dark
title: If cold and dark
kind: flow
basis:
  - prior-release
steps:
  - id: ifly-737-max8.cold-dark.battery-switch
    number: 1
    text: BATTERY SWITCH
    expect: "ON, GUARD CLOSED"
    controls:
      - bat
    quick: always
    why: "Connects the battery, the first switch in a cold start"
    status: draft
  - id: ifly-737-max8.cold-dark.standby-power-switch
    number: 2
    text: STANDBY POWER SWITCH
    expect: "AUTO, GUARD CLOSED"
    controls:
      - stby
    quick: always
    why: Standby buses stay powered from the battery if AC fails
    status: draft
  - id: ifly-737-max8.cold-dark.alternate-flaps-switches
    number: 3
    text: ALTERNATE FLAPS SWITCHES
    expect: "ARM SWITCH OFF, GUARD CLOSED, POSITION SWITCH OFF"
    controls:
      - altflap
    why: "Electric flap backup, off in normal use"
    status: draft
  - id: ifly-737-max8.cold-dark.wiper-selectors
    number: 4
    text: WIPER SELECTORS
    expect: PARK
    controls:
      - wiper
    note: Park keeps the wipers stowed. Wipers should not run on a dry windshield.
    why: Wipers must not run on a dry windshield
    status: draft
  - id: ifly-737-max8.cold-dark.hydraulic-pump-switches
    number: 5
    text: HYDRAULIC PUMP SWITCHES
    expect: "ENG 1 AND 2 ON, ELEC 1 AND 2 OFF"
    controls:
      - hydpumps
    note: "Engine pumps stay ON so they are ready at start. Electric pumps stay OFF until you need hydraulic pressure, so the system does not pressurize unexpectedly."
    why: "Engine pumps ready, electric pumps off until needed"
    check: ENG 1 and ENG 2 ON
    check_detail: ELEC 1 and ELEC 2 OFF
    status: draft
  - id: ifly-737-max8.cold-dark.landing-gear-lever
    number: 6
    text: LANDING GEAR LEVER
    expect: DN
    controls:
      - gearlever
    quick: always
    note: "Check this before hydraulic pressure comes on, so the lever matches the gear when the system pressurizes."
    why: Lever must match the gear before hydraulics come on
    check: "3 green gear lights"
    status: draft
