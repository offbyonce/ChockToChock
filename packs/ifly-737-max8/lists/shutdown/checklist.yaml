# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: shutdown-shutdown-checklist
title: Shutdown checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.shutdown.fuel-pump-switches-check
    text: FUEL PUMP SWITCHES
    expect: "OFF"
    controls:
      - fuelpumps
    targets:
      - at: "oh/fuel/CTR L/1"
        set: "OFF"
      - at: "oh/fuel/CTR R/1"
        set: "OFF"
      - at: "oh/fuel/AFT 1/1"
        set: "OFF"
      - at: "oh/fuel/FWD 1/1"
        set: "OFF"
      - at: "oh/fuel/FWD 2/1"
        set: "OFF"
      - at: "oh/fuel/AFT 2/1"
        set: "OFF"
    why: "Engines stopped, nothing to feed"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.probe-heat
    text: PROBE HEAT
    expect: "AUTO"
    controls:
      - pheat
    targets:
      - at: "oh/heat/PROBE A/1"
        set: "AUTO"
      - at: "oh/heat/PROBE B/1"
        set: "AUTO"
    note: "The iFly tutorial's shutdown checklist says OFF, but the MAX probe heat switches have only AUTO and ON. AUTO turns the heat off once the engines are shut down."
    why: "Not needed once the engines are stopped."
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.hydraulic-pump-switches
    text: HYDRAULIC PUMP SWITCHES
    expect: ELEC 1 AND 2 OFF
    controls:
      - elechyd
    targets:
      - at: "oh/hyd/ELEC 2/1"
        set: "OFF"
      - at: "oh/hyd/ELEC 1/1"
        set: "OFF"
    why: Not needed after shutdown
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.flaps
    text: FLAPS
    expect: UP
    controls:
      - flaplever
    targets:
      - at: "con/st/FLAP LEVER/1"
        set: "UP"
    why: Flaps stowed at the gate
    check: Flaps UP
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.parking-brake-check
    text: PARKING BRAKE
    expect: "SET, UNLESS CHOCKS ARE IN AND THE BRAKE IS RELEASED"
    controls:
      - pbrake
    targets:
      - at: "con/lo/PARKING BRAKE/1"
        set: "SET"
      - at: "con/lo/PARK BRAKE LIGHT/1"
        light: on
    why: Holds the airplane while parked
    check: "Set, or released with chocks in place"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.engine-start-levers-check
    text: ENGINE START LEVERS
    expect: CUTOFF
    controls:
      - slever
    targets:
      - at: "con/lo/START LEVER 1/1"
        set: "CUTOFF"
      - at: "con/lo/START LEVER 2/1"
        set: "CUTOFF"
    note: Cuts fuel to the engines.
    why: Stops fuel and shuts down the engines
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.irs-check
    text: IRS
    expect: "OFF, OR LEAVE IN NAV FOR A QUICK TURNAROUND"
    controls:
      - irs
    targets:
      - at: "aft/irs/IRS L/1"
      - at: "aft/irs/IRS R/1"
    why: Leaving NAV avoids a new alignment if you fly again soon
  - id: ifly-737-max8.shutdown.weather-radar
    text: WEATHER RADAR
    expect: "OFF"
    controls:
      - efispanel
    targets:
      - at: "gl/efisl/WXR/1"
      - at: "gl/efisr/WXR/1"
    why: A transmitting radar is a hazard to ground crew and during fueling
    panel_lights:
      efispanel:
        - WXR
    not_simulated: true
  - id: ifly-737-max8.shutdown.fuel-quantity
    text: FUEL QUANTITY
    expect: CHECKED AGAINST THE CDU
    controls:
      - fuelq
    targets:
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
    why: Confirms the fuel used
    check: Fuel matches the CDU
  - id: ifly-737-max8.shutdown.outflow-valve-below-10c
    text: OUTFLOW VALVE (BELOW -10C)
    expect: "90% CLOSED"
    controls:
      - outflow
    targets:
      - at: "oh/press/VALVE/1"
      - at: "oh/press/OUTFLOW/1"
    why: Keeps snow and ice out of the outflow valve
