# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: shutdown-shutdown-procedure
title: Shutdown procedure
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.shutdown.apu-generator-switches
    number: 1
    text: APU GENERATOR SWITCHES
    expect: BOTH ON
    controls:
      - apugen
    quick: always
    note: "Take power from the APU before you stop the engines, or you lose normal AC power."
    why: Puts APU power on both transfer buses
    check: APU GEN OFF BUS light OUT
    how: gens2
    status: checked
  - id: ifly-737-max8.shutdown.parking-brake
    number: 2
    text: PARKING BRAKE
    expect: SET
    controls:
      - pbrake
    quick: always
    why: Holds the airplane at the gate
    check: Parking brake light ON
    status: checked
  - id: ifly-737-max8.shutdown.engine-start-levers
    number: 3
    text: ENGINE START LEVERS
    expect: CUTOFF
    controls:
      - slever
    quick: always
    note: Cuts fuel to the engines.
    why: Stops fuel and shuts down the engines
    status: checked
  - id: ifly-737-max8.shutdown.fasten-belts-selector
    number: 4
    text: FASTEN BELTS SELECTOR
    expect: "OFF"
    controls:
      - sblts
    why: Passengers may stand
    status: checked
  - id: ifly-737-max8.shutdown.anti-collision-light
    number: 5
    text: ANTI-COLLISION LIGHT
    expect: "OFF"
    controls:
      - beacon
    quick: always
    why: Engines have stopped
    status: checked
  - id: ifly-737-max8.shutdown.taxi-light
    text: TAXI LIGHT
    expect: "OFF"
    controls:
      - lldg
    quick: always
    why: Not needed once parked
    check: TAXI switch OFF
    if_not: Taxi light still on
    if_not_detail: Switch the TAXI light OFF
    status: checked
  - id: ifly-737-max8.shutdown.fuel-pump-switches
    number: 6
    text: FUEL PUMP SWITCHES
    expect: ALL OFF
    controls:
      - fuelpumps
    quick: always
    why: "Engines stopped, nothing to feed"
    status: checked
  - id: ifly-737-max8.shutdown.cab-util-and-ife-pass-seat-switches
    number: 7
    text: CAB/UTIL AND IFE/PASS SEAT SWITCHES
    expect: "OFF"
    controls:
      - cabutil
    why: Cabin power not needed now
    status: checked
  - id: ifly-737-max8.shutdown.anti-ice
    number: 8
    text: ANTI-ICE
    expect: "OFF"
    controls:
      - aice
    quick: always
    why: Not needed after shutdown
    status: checked
  - id: ifly-737-max8.shutdown.electric-hydraulic-pump-switches
    number: 9
    text: ELECTRIC HYDRAULIC PUMP SWITCHES
    expect: "OFF"
    controls:
      - elechyd
    quick: always
    why: No hydraulic pressure needed at the gate
    status: checked
  - id: ifly-737-max8.shutdown.pack-switches
    number: 10
    text: PACK SWITCHES
    expect: AUTO
    controls:
      - packs
    why: Supplies conditioned air to the cabin
    check: PACK lights OUT
    status: checked
  - id: ifly-737-max8.shutdown.isolation-valve-switch
    number: 11
    text: ISOLATION VALVE SWITCH
    expect: OPEN
    controls:
      - iso
    why: One APU feeds both packs
    status: checked
  - id: ifly-737-max8.shutdown.apu-bleed-switch
    number: 12
    text: "ENGINE AND APU BLEED SWITCHES"
    expect: "ON"
    controls:
      - apubleed
    why: Feeds APU air for ground air conditioning
    status: checked
  - id: ifly-737-max8.shutdown.flight-directors
    number: 13
    text: FLIGHT DIRECTORS
    expect: "OFF"
    controls:
      - fd
    note: Turns off the guidance for the next crew.
    why: Reset for the next crew
    status: checked
  - id: ifly-737-max8.taxi-in.transponder
    text: TRANSPONDER
    expect: ALT OFF
    controls:
      - xpndr
    quick: always
    note: Once parked, set the mode selector to ALT OFF.
    why: The transponder stops reporting once the flight is over.
    status: checked
  - id: ifly-737-max8.shutdown.wheel-chocks-and-cones
    number: 14
    text: WHEEL CHOCKS AND CONES
    expect: "SET IF NEEDED, THEN RELEASE THE PARKING BRAKE"
    controls:
      - chocks
    note: "Without chocks, the airplane can creep as parking brake pressure bleeds away."
    why: Holds the airplane without the brake
    check: "Chocks in place before the brake is released"
    status: checked
  - id: ifly-737-max8.shutdown.ground-power
    text: GROUND POWER
    expect: "IF AVAILABLE, CONNECT AND VERIFY ACCEPTED, THEN APU OFF"
    controls:
      - grdpwr
    why: Takes over before the APU goes off
    check: Ground power on the buses
    check_detail: "GRD POWER switch ON once the AVAILABLE light is on, then the APU switch OFF"
    status: draft
  - id: ifly-737-max8.shutdown.irs
    number: 15
    text: IRS
    expect: "OFF, OR LEAVE IN NAV FOR A QUICK TURNAROUND"
    controls:
      - irs
    why: Leaving NAV avoids a new alignment if you fly again soon
    status: draft
