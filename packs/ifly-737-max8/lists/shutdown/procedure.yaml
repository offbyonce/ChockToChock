# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: shutdown-shutdown-procedure
title: Shutdown procedure
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.shutdown.apu-generator-switches
    number: 1
    text: APU GENERATOR SWITCHES
    expect: BOTH ON
    terms: ["APU", "GEN OFF BUS", "P5"]
    controls:
      - apugen
    targets:
      - at: "oh/elecl/APU GEN/1"
        set: "ON"
      - at: "oh/elecl/APU GEN/2"
        set: "ON"
    quick: always
    note: "Take power from the APU before you stop the engines, or you lose normal AC power."
    note_caution: true
    why: Puts APU power on both transfer buses
    check: APU GEN OFF BUS light OUT
    how: gens2
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.parking-brake
    number: 2
    text: PARKING BRAKE
    expect: SET
    controls:
      - pbrake
    targets:
      - at: "con/lo/PARKING BRAKE/1"
        set: "SET"
      - at: "con/lo/PARK BRAKE LIGHT/1"
        light: on
    quick: always
    why: Holds the airplane at the gate
    check: Parking brake light ON
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.engine-start-levers
    number: 3
    text: ENGINE START LEVERS
    expect: CUTOFF
    controls:
      - slever
    targets:
      - at: "con/lo/START LEVER 1/1"
        set: "CUTOFF"
      - at: "con/lo/START LEVER 2/1"
        set: "CUTOFF"
    quick: always
    note: Cuts fuel to the engines.
    why: Stops fuel and shuts down the engines
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.fasten-belts-selector
    number: 4
    text: FASTEN BELTS SELECTOR
    expect: "OFF"
    terms: ["P5"]
    controls:
      - sblts
    targets:
      - at: "oh/col/FASTEN BELTS/1"
        set: "OFF"
    why: Passengers may stand
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.anti-collision-light
    number: 5
    text: ANTI-COLLISION LIGHT
    expect: "OFF"
    terms: ["P5"]
    controls:
      - beacon
    targets:
      - at: "oh/lte/ANTI COLLISION/1"
        set: "OFF"
    quick: always
    why: Engines have stopped
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.taxi-light
    text: TAXI LIGHT
    expect: "OFF"
    terms: ["P5"]
    controls:
      - lldg
    targets:
      - at: "oh/ltl/TAXI/1"
        set: "OFF"
    quick: always
    why: Not needed once parked
    check: TAXI switch OFF
    if_not: Taxi light still on
    if_not_detail: Switch the TAXI light OFF
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.fuel-pump-switches
    number: 6
    text: FUEL PUMP SWITCHES
    expect: ALL OFF
    terms: ["P5"]
    controls:
      - fuelpumps
    targets:
      - at: "oh/fuel/CTR L/1"
        set: "OFF"
      - at: "oh/fuel/CTR R/1"
        set: "OFF"
      - at: "oh/fuel/AFT 1/1"
        set: "OFF"
      - at: "oh/fuel/FWD 1/1"
        set: "OFF"
      - at: "oh/fuel/FWD 2/1"
        set: "OFF"
      - at: "oh/fuel/AFT 2/1"
        set: "OFF"
    quick: always
    why: "Engines stopped, nothing to feed"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.cab-util-and-ife-pass-seat-switches
    number: 7
    text: CAB/UTIL AND IFE/PASS SEAT SWITCHES
    expect: "OFF"
    terms: ["CAB/UTIL", "P5"]
    controls:
      - cabutil
    targets:
      - at: "oh/elecu/CAB/UTIL/1"
        set: "OFF"
      - at: "oh/elecu/IFE/PASS SEAT/1"
        set: "OFF"
    why: Cabin power not needed now
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.anti-ice
    number: 8
    text: ANTI-ICE
    expect: "OFF"
    terms: ["anti-ice", "P5"]
    controls:
      - aice
    targets:
      - at: "oh/aice/WING ANTI-ICE/1"
        set: "OFF"
      - at: "oh/aice/ENG 1/1"
        set: "OFF"
      - at: "oh/aice/ENG 2/1"
        set: "OFF"
    quick: always
    why: Not needed after shutdown
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.electric-hydraulic-pump-switches
    number: 9
    text: ELECTRIC HYDRAULIC PUMP SWITCHES
    expect: "OFF"
    terms: ["P5"]
    controls:
      - elechyd
    targets:
      - at: "oh/hyd/ELEC 2/1"
        set: "OFF"
      - at: "oh/hyd/ELEC 1/1"
        set: "OFF"
    quick: always
    why: No hydraulic pressure needed at the gate
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.pack-switches
    number: 10
    text: PACK SWITCHES
    expect: AUTO
    terms: ["PACK", "P5", "Bleed air"]
    controls:
      - packs
    targets:
      - at: "oh/bleed/L PACK/1"
        set: "AUTO"
      - at: "oh/bleed/R PACK/1"
        set: "AUTO"
    why: Supplies conditioned air to the cabin
    check: PACK lights OUT
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.isolation-valve-switch
    number: 11
    text: ISOLATION VALVE SWITCH
    expect: OPEN
    terms: ["ISOLATION VALVE", "APU", "P5", "Bleed air"]
    controls:
      - iso
    targets:
      - at: "oh/bleed/ISOLATION VALVE/1"
        set: "OPEN"
    why: One APU feeds both packs
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.apu-bleed-switch
    number: 12
    text: "ENGINE AND APU BLEED SWITCHES"
    expect: "ON"
    terms: ["APU", "P5", "Bleed air"]
    controls:
      - apubleed
      - engbleed
    targets:
      - at: "oh/bleed/APU BLEED/1"
        set: "ON"
      - at: "oh/bleed/ENG BLEED 1/1"
        set: "ON"
      - at: "oh/bleed/ENG BLEED 2/1"
        set: "ON"
    why: Feeds APU air for ground air conditioning
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.flight-directors
    number: 13
    text: FLIGHT DIRECTORS
    expect: "OFF"
    terms: ["P7"]
    controls:
      - fd
    targets:
      - at: "gl/mcp/F/D L/1"
        set: "OFF"
      - at: "gl/mcp/F/D R/1"
        set: "OFF"
    note: Turns off the guidance for the next crew.
    why: Reset for the next crew
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.taxi-in.transponder
    text: TRANSPONDER
    expect: ALT OFF
    terms: ["ALT OFF"]
    controls:
      - xpndr
    targets:
      - at: "con/atc/MODE/1"
        set: "ALT OFF"
    quick: always
    note: Once parked, set the mode selector to ALT OFF.
    note_caution: true
    why: The transponder stops reporting once the flight is over.
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.wheel-chocks-and-cones
    number: 14
    text: WHEEL CHOCKS AND CONES
    expect: "SET IF NEEDED, THEN RELEASE THE PARKING BRAKE"
    controls:
      - chocks
    note: "Without chocks, the airplane can creep as parking brake pressure bleeds away."
    note_caution: true
    why: Holds the airplane without the brake
    check: "Chocks in place before the brake is released"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.shutdown.ground-power
    text: GROUND POWER
    expect: "IF AVAILABLE, CONNECT AND VERIFY ACCEPTED, THEN APU OFF"
    terms: ["APU", "P5"]
    controls:
      - grdpwr
      - apusw
    targets:
      - at: "oh/elecl/GRD PWR/1"
        open: true
      - at: "oh/apu/APU/1"
        open: true
    why: Takes over before the APU goes off
    check: Ground power on the buses
    check_detail: "GRD POWER switch ON once the AVAILABLE light is on, then the APU switch OFF"
  - id: ifly-737-max8.shutdown.irs
    number: 15
    text: IRS
    expect: "OFF, OR LEAVE IN NAV FOR A QUICK TURNAROUND"
    terms: ["IRS", "NAV", "P5"]
    controls:
      - irs
    targets:
      - at: "aft/irs/IRS L/1"
      - at: "aft/irs/IRS R/1"
    why: Leaving NAV avoids a new alignment if you fly again soon
