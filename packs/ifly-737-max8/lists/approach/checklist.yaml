# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: approach-approach-checklist
title: Approach checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.approach.altimeters-check
    text: ALTIMETERS
    expect: "___ SET"
    controls:
      - baro
    targets:
      - at: "gl/efisl/BARO/1"
      - at: "gl/efisr/BARO/1"
    fill:
      - qnh
    note: "Below the transition level, altimeters must read local QNH so you see your true altitude above sea level."
    why: True altitude below transition
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.approach.fasten-belts-selector-check
    text: FASTEN BELTS SELECTOR
    expect: "AUTO OR ON"
    controls:
      - sblts
    targets:
      - at: "oh/col/FASTEN BELTS/1"
    note: Tells the cabin to sit down for landing.
    why: Cabin seated for landing
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.approach.exterior-lights
    text: EXTERIOR LIGHTS
    expect: "LANDING, WING AND LOGO ON"
    controls:
      - landlt
      - winglt
      - logo
    targets:
      - at: "oh/ltl/LANDING L/1"
        set: "ON"
      - at: "oh/ltl/LANDING R/1"
        set: "ON"
      - at: "oh/lte/LOGO/1"
        set: "ON"
      - at: "oh/lte/WING/1"
        set: "ON"
    why: "See and be seen below 10,000 ft"
