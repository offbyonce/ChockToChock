# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: approach-approach-procedure
title: Approach procedure
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.approach.altimeters
    text: ALTIMETERS
    expect: SET QNH AT TRANSITION
    controls:
      - baro
    hint:
      - prefix: TRANS LEVEL FL
        field: transition_level
    quick: always
    note: "Below the transition level, altimeters must read local QNH so you see your true altitude above sea level."
    why: True altitude below transition
    how: baro
    status: checked
  - id: ifly-737-max8.approach.landing-lights-wing-lights-logo-light
    number: 1
    text: "LANDING LIGHTS, WING LIGHTS, LOGO LIGHT"
    expect: "ON"
    controls:
      - landlt
      - winglt
      - logo
    quick: always
    why: "See and be seen below 10,000 ft"
    status: draft
  - id: ifly-737-max8.approach.fasten-belts-selector
    number: 2
    text: FASTEN BELTS SELECTOR
    expect: "AUTO OR ON"
    controls:
      - sblts
    note: Tells the cabin to sit down for landing.
    why: Cabin seated for landing
    status: checked
  - id: ifly-737-max8.approach.multi-mode-receiver
    number: 3
    text: MULTI-MODE RECEIVER
    expect: TUNE THE ILS FOR THE LANDING RUNWAY
    controls:
      - mmr
    quick: always
    show_if:
      option: approach
      equals: ils
    note: Tune the ILS and identify it before you rely on it.
    why: Identify it before you rely on it
    check: "ILS ident shown on the PFD, or the Morse ident heard"
    how: ils
    status: checked
  - id: ifly-737-max8.approach.approach-in-the-cdu
    text: APPROACH IN THE CDU
    expect: CORRECT APPROACH ON THE LEGS PAGE
    controls:
      - fmc
    quick: always
    show_if:
      option: approach
      equals: rnav
    note: "An RNAV approach follows the route in the FMC, so check it matches the chart."
    why: An RNAV approach follows the FMC route
    check: Approach matches the chart
    status: draft
  - id: ifly-737-max8.approach.course-selectors
    number: 4
    text: COURSE SELECTORS
    expect: FINAL APPROACH COURSE SET
    controls:
      - crs
    quick: always
    why: "Both course selectors on the published final approach course, so the localizer can be compared with it"
    check: Course shows on the ND
    status: checked
  - id: ifly-737-max8.approach.app-mcp
    text: APP (MCP)
    expect: "ARM, VOR/LOC AND G/S ARMED ON THE FMA"
    controls:
      - appmode
    quick: always
    show_if:
      option: approach
      equals: ils
    why: Lets the autopilot capture the localizer and glideslope
    check: VOR/LOC and G/S white on the FMA
    check_detail: Each turns green when it captures
    if_not: Localizer or glideslope does not capture
    if_not_detail: Check the ILS frequency and course
    how: ils
    status: checked
