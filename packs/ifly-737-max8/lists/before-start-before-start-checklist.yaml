id: before-start-before-start-checklist
title: Before start checklist
kind: checklist
basis:
  - prior-release
steps:
  - id: ifly-737-max8.before-start.flight-deck-door
    text: FLIGHT DECK DOOR
    expect: CLOSED AND LOCKED
    controls:
      - fdd
    why: Closed before departure
    check: Door closed and locked
    status: draft
  - id: ifly-737-max8.before-start.fuel
    text: FUEL
    expect: "REQUIRED ___ KG/LBS, ON BOARD ___ KG/LBS, FUEL PUMPS ON, CENTER PUMPS ON IF MORE THAN 1,000 LB (ABOUT 450 KG) IN THE CENTER TANK"
    controls:
      - fuelq
      - fuelpumps
    fill:
      - minimum_takeoff_fuel
      - fuel
    why: Confirms enough fuel for the flight
    check: Departing fuel above minimum
    check_detail: "Pumps ON, center with 1,000 LB or more"
    status: draft
  - id: ifly-737-max8.before-start.passenger-signs
    text: PASSENGER SIGNS
    expect: "NO SMOKING AUTO, FASTEN BELTS ON"
    controls:
      - signs
    why: Passengers seated with belts on for push and taxi
    status: draft
  - id: ifly-737-max8.before-start.flight-deck-windows
    text: FLIGHT DECK WINDOWS
    expect: CLOSED AND LOCKED
    controls:
      - windows
    why: An open window stops pressurization
    check: Windows closed and locked
    status: draft
  - id: ifly-737-max8.before-start.mcp-check
    text: MCP
    expect: "V2 ___, HEADING ___, ALTITUDE ___"
    controls:
      - mcpset
    fill:
      - v2
      - heading
      - initial_altitude
    why: Confirms the departure set-up
    check: "V2, heading and altitude agree"
    status: draft
  - id: ifly-737-max8.before-start.takeoff-speeds
    text: TAKEOFF SPEEDS
    expect: "V1, VR AND V2 SET AND CHECKED"
    controls:
      - cdu
    why: Speeds match the takeoff data
    check: "V1, VR and V2 shown on the speed tape"
    status: draft
  - id: ifly-737-max8.before-start.cdu-preflight
    text: CDU PREFLIGHT
    expect: COMPLETE
    controls:
      - cdu
    why: "Route, performance and takeoff reference in"
    check: Preflight pages complete
    status: draft
  - id: ifly-737-max8.before-start.rudder-and-aileron-trim
    text: RUDDER AND AILERON TRIM
    expect: "FREE, AT ZERO"
    controls:
      - trimp
    quick: turnaround
    why: No trim left in for takeoff
    check: Both trims at zero
    check_detail: Trim controls move freely
    status: draft
  - id: ifly-737-max8.before-start.taxi-and-takeoff-briefing
    text: TAXI AND TAKEOFF BRIEFING
    expect: COMPLETE
    controls:
      - brief
    why: "Covers the taxi route, the departure, and what to do if something goes wrong"
    status: draft
  - id: ifly-737-max8.before-start.anti-collision-light-check
    text: ANTI-COLLISION LIGHT
    expect: "ON"
    controls:
      - beacon
    why: Warns people that engines are about to start
    explain: beacon
    status: draft
