# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against official documents. Edit by hand; do not regenerate.
id: memory-airspeed-unreliable
title: Airspeed unreliable
kind: non-normal
basis:
  - regulator-docs
memory: true
when: You suspect one or more airspeed or Mach readings are wrong.
why: "A safe pitch and thrust setting keeps the airplane flying while you work out which indications to trust."
steps:
  - id: ifly-737-max8.memory.autopilot-if-engaged-airspeed-unreliable
    number: 1
    text: AUTOPILOT (IF ENGAGED)
    expect: DISENGAGE
    terms: ["P7"]
    controls:
      - apdis
      - apdisc
    targets:
      - at: "seat/yoke/A/P DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.autothrottle-if-engaged-airspeed-unreliable
    number: 2
    text: AUTOTHROTTLE (IF ENGAGED)
    expect: DISENGAGE
    controls:
      - apdisc
    targets:
      - at: "con/st/A/T DISENGAGE/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.f-d-switches-both
    number: 3
    text: F/D SWITCHES (BOTH)
    expect: "OFF"
    terms: ["F/D", "P7"]
    controls:
      - fd
    targets:
      - at: "gl/mcp/F/D L/1"
        set: "OFF"
      - at: "gl/mcp/F/D R/1"
        set: "OFF"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.if-flaps-extended
    number: 4
    text: IF FLAPS EXTENDED
    expect: "SET 10 DEGREES PITCH AND 80% N1"
    terms: ["N1"]
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.if-flaps-up
    number: 5
    text: IF FLAPS UP
    expect: "SET 4 DEGREES PITCH AND 75% N1"
    terms: ["N1"]
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.probe-heat-switches
    number: 6
    text: PROBE HEAT SWITCHES
    expect: "CHECK ON"
    terms: ["probe heat", "P5"]
    controls:
      - pheat
    targets:
      - at: "oh/heat/PROBE A/1"
        set: "ON"
      - at: "oh/heat/PROBE B/1"
        set: "ON"
    non_recall: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.reliable-references
    number: 7
    text: RELIABLE REFERENCES
    expect: "ATTITUDE, N1, GROUND SPEED AND RADIO ALTITUDE"
    terms: ["N1"]
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    non_recall: true
    note: "Stick shaker, overspeed and low airspeed alerts may sound falsely, even together."
    note_caution: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.airspeed
    number: 8
    text: AIRSPEED
    expect: FIND A RELIABLE SOURCE AND USE IT
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    non_recall: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.if-only-standby-airspeed-is-reliable
    number: 9
    text: IF ONLY STANDBY AIRSPEED IS RELIABLE
    expect: "NO AUTOPILOT, AUTOTHROTTLE OR FLIGHT DIRECTORS"
    terms: ["P2"]
    controls:
      - isfdc
      - mcpset
      - fd
    targets:
      - at: "mn/ctr/STANDBY DISPLAY/1"
      - at: "gl/mcp/A/T ARM/1"
      - at: "gl/mcp/F/D L/1"
      - at: "gl/mcp/F/D R/1"
    non_recall: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.if-captain-or-fo-airspeed-is-reliable
    number: 10
    text: IF CAPTAIN OR FO AIRSPEED IS RELIABLE
    expect: "USE THAT SIDE'S F/D AND AUTOPILOT IF NEEDED. KEEP AUTOTHROTTLE OFF"
    terms: ["F/D", "P7"]
    controls:
      - fd
      - mcpset
    targets:
      - at: "gl/mcp/F/D L/1"
        open: true
      - at: "gl/mcp/F/D R/1"
        open: true
      - at: "gl/mcp/A/T ARM/1"
        set: "OFF"
    non_recall: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.if-no-reliable-airspeed
    number: 11
    text: IF NO RELIABLE AIRSPEED
    expect: PITCH AND THRUST FROM APPROVED TABLES
    controls:
      - fltinst
    targets:
      - at: "mn/cd/OUTBOARD DU: PFD/1"
      - at: "mn/cd/INBOARD DU: ND AND ENGINES/1"
      - at: "mn/fd/INBOARD DU: ND/1"
      - at: "mn/fd/OUTBOARD DU: PFD/1"
    non_recall: true
    note: "Once trimmed and stable, compare each airspeed with the table. A gap above 20 knots or 0.03 Mach marks that indicator as unreliable."
    note_caution: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.transponder
    number: 12
    text: TRANSPONDER
    expect: "USE THE RELIABLE SIDE WITH TRAFFIC ALERTS ONLY. ALTITUDE REPORTING OFF IF BOTH ARE UNRELIABLE"
    controls:
      - xpndr
    targets:
      - at: "con/atc/ALT SOURCE 1/1"
      - at: "con/atc/XPNDR/1"
      - at: "con/atc/MODE/1"
      - at: "con/atc/ALT SOURCE 2/1"
    non_recall: true
    note: "The airplane may no longer meet RVSM requirements."
    note_caution: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
  - id: ifly-737-max8.memory.approach-and-go-around-airspeed-unreliable
    text: "APPROACH AND GO-AROUND"
    expect: "BARO MINIMUMS ON THE RELIABLE PFD ONLY. NO TO/GA IF ONLY STANDBY AIRSPEED IS RELIABLE"
    terms: ["BARO", "PFD", "TO/GA"]
    non_recall: true
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-10
