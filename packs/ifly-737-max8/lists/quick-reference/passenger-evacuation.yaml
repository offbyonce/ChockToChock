    expect: DOWN DETENT
    controls:
      - speedbrake
    targets:
      - at: "con/st/SPEEDBRAKE LEVER/1"
        set: "DOWN"
  - id: ifly-737-max8.quick-reference.flap-lever
    number: 3
    text: FLAP LEVER
    expect: "40"
    controls:
      - flaplever
    targets:
