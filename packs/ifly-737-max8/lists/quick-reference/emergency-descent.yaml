# Generated by tools/import-3x.
id: quick-reference-emergency-descent
title: Emergency descent
kind: non-normal
basis:
  - prior-release
when: "Cabin altitude cannot be controlled above 14,000 ft, or a rapid descent is needed."
why: "Simulator training only. Not for real-world use. Get down to breathable air as quickly as is safe."
steps:
  - id: ifly-737-max8.quick-reference.emergency-descent
    number: 1
    text: EMERGENCY DESCENT
    expect: "TELL THE CREW, THEN WARN THE CABIN ON THE PA"
    controls:
      - pa
  - id: ifly-737-max8.quick-reference.fasten-belts
    number: 2
    text: FASTEN BELTS
    expect: "ON"
    controls:
      - sblts
  - id: ifly-737-max8.quick-reference.descent
    number: 3
    text: DESCENT
    expect: "NOW, TO THE GREATER OF 10,000 FT AND MINIMUM SAFE ALTITUDE"
    controls:
      - mcpalt
  - id: ifly-737-max8.quick-reference.start-switches
    number: 4
    text: START SWITCHES
    expect: CONT
    controls:
      - starts
    panel_lights:
      starts:
        - ENGINE START 1
        - ENGINE START 2
  - id: ifly-737-max8.quick-reference.thrust-levers
    number: 5
    text: THRUST LEVERS
    expect: "CLOSE, OR AS FAR AS ANTI-ICE ALLOWS"
    controls:
      - thrust
  - id: ifly-737-max8.quick-reference.speed-brake
    number: 6
    text: SPEED BRAKE
    expect: FLIGHT DETENT
    controls:
      - speedbrake
  - id: ifly-737-max8.quick-reference.target-speed
    number: 7
    text: TARGET SPEED
    expect: "MMO/VMO (MAXIMUM OPERATING SPEED). IF STRUCTURE IS IN DOUBT, LIMIT SPEED AND AVOID HIGH MANEUVERING LOADS"
    controls:
      - speedt
  - id: ifly-737-max8.quick-reference.atc
    number: 8
    text: ATC
    expect: ADVISE. SQUAWK 7700 IF UNABLE TO COMMUNICATE AT ONCE
    controls:
      - xpndr
  - id: ifly-737-max8.quick-reference.approaching-level-off
    number: 9
    text: APPROACHING LEVEL OFF
    expect: "SMOOTHLY LOWER SPEED BRAKE TO DOWN DETENT, ADD THRUST"
    controls:
      - speedbrake
    non_recall: true
  - id: ifly-737-max8.quick-reference.crew-oxygen-regulators
    number: 10
    text: CREW OXYGEN REGULATORS
    expect: "NORMAL. USE OXYGEN WHEN CABIN IS ABOVE 10,000 FT"
    controls:
      - mask
    non_recall: true
