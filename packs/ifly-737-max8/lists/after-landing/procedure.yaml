# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: after-landing-after-landing-procedure
title: After landing procedure
kind: flow
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.after-landing.autobrake
    number: 1
    text: AUTOBRAKE
    expect: "OFF"
    controls:
      - abrake
    targets:
      - at: "con/ed/AUTO BRAKE/1"
        set: "OFF"
    quick: always
    why: Taxi on the toe brakes
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.speedbrake-lever
    number: 2
    text: SPEEDBRAKE LEVER
    expect: DOWN DETENT
    controls:
      - speedbrake
    targets:
      - at: "con/st/SPEEDBRAKE LEVER/1"
        set: "DOWN"
    quick: always
    why: Keeps the spoilers stowed on the ground
    check: Lever in DOWN detent
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.probe-heat
    number: 3
    text: PROBE HEAT
    expect: AUTO
    controls:
      - pheat
    targets:
      - at: "oh/heat/PROBE A/1"
        set: "AUTO"
      - at: "oh/heat/PROBE B/1"
        set: "AUTO"
    quick: always
    note: "AUTO keeps probe heat on while an engine runs, then off after shutdown."
    why: Probe heat stops by itself after shutdown
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.position-light
    number: 4
    text: POSITION LIGHT
    expect: STEADY
    controls:
      - poslt
    targets:
      - at: "oh/lte/POSITION/1"
        set: "STEADY"
    quick: always
    why: Strobes off on the ground
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.wing-light-landing-light-and-turnoff-lights
    number: 5
    text: "WING LIGHT, LANDING LIGHT AND TURNOFF LIGHTS"
    expect: "OFF"
    controls:
      - winglt
      - landlt
      - turnoff
    targets:
      - at: "oh/lte/WING/1"
        set: "OFF"
      - at: "oh/ltl/LANDING L/1"
        set: "OFF"
      - at: "oh/ltl/LANDING R/1"
        set: "OFF"
      - at: "oh/ltl/TURNOFF L/1"
        set: "OFF"
      - at: "oh/ltl/TURNOFF R/1"
        set: "OFF"
    quick: always
    why: Not needed for taxi
  - id: ifly-737-max8.after-landing.engine-start-switches
    number: 6
    text: ENGINE START SWITCHES
    expect: "OFF"
    controls:
      - starts
    targets:
      - at: "oh/start/ENGINE START 1/1"
        set: "OFF"
      - at: "oh/start/ENGINE START 2/1"
        set: "OFF"
    quick: always
    why: Ignition not needed for taxi
    panel_lights:
      starts:
        - ENGINE START 1
        - ENGINE START 2
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.flaps
    number: 7
    text: FLAPS
    expect: RETRACT
    controls:
      - flaplever
    targets:
      - at: "con/st/FLAP LEVER/1"
    quick: always
    note: Retract once you are clear of the runway.
    why: Flaps are not needed for taxi
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.transponder
    text: "TRANSPONDER"
    expect: "MODE SELECTOR TO XPNDR"
    why: "TCAS alerts are not needed on the ground, but airport surveillance can still track you."
    number: 8
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.efis
    number: 9
    text: EFIS
    expect: WXR AND TERR OFF
    controls:
      - efispanel
    targets:
      - at: "gl/efisl/WXR/1"
      - at: "gl/efisr/WXR/1"
      - at: "gl/efisl/TERR/1"
      - at: "gl/efisr/TERR/1"
    why: Display not needed for taxi
    panel_lights:
      efispanel:
        - WXR
        - TERR
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.after-landing.apu-switch
    number: 10
    text: APU SWITCH
    expect: "START, THEN RELEASE TO ON"
    controls:
      - apusw
    targets:
      - at: "oh/apu/APU/1"
        set: "ON"
    quick: always
    why: Starts the APU for power and air
    how: apuland
