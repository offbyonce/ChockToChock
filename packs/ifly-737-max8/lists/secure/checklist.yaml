# yaml-language-server: $schema=../../../../schemas/checklist.schema.json
# Imported from 3.0, then validated against vendor documentation. Edit by hand; do not regenerate.
id: secure-secure-checklist
title: Secure checklist
kind: checklist
basis:
  - ifly-docs
steps:
  - id: ifly-737-max8.secure.electric-hydraulic-pump-switches
    text: ELECTRIC HYDRAULIC PUMP SWITCHES
    expect: "OFF"
    controls:
      - elechyd
    targets:
      - at: "oh/hyd/ELEC 2/1"
        set: "OFF"
      - at: "oh/hyd/ELEC 1/1"
        set: "OFF"
    why: Not needed when secured
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.secure.irs-check
    text: IRS
    expect: "OFF"
    controls:
      - irs
    targets:
      - at: "aft/irs/IRS L/1"
        set: "OFF"
      - at: "aft/irs/IRS R/1"
        set: "OFF"
    note: Stops the navigation system. It must realign before the next flight.
    why: Must realign before the next flight
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.secure.window-heat
    text: WINDOW HEAT
    expect: "OFF"
    controls:
      - wheat
    targets:
      - at: "oh/heat/L SIDE/1"
        set: "OFF"
      - at: "oh/heat/L FWD/1"
        set: "OFF"
      - at: "oh/heat/R FWD/1"
        set: "OFF"
      - at: "oh/heat/R SIDE/1"
        set: "OFF"
    why: Not needed when secured
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.secure.emergency-exit-lights-check
    text: EMERGENCY EXIT LIGHTS
    expect: "OFF"
    controls:
      - emerext
    targets:
      - at: "oh/col/NOT ARMED/1"
      - at: "oh/col/EMER EXIT LIGHTS/1"
        set: "OFF"
    why: ARMED would light the exit lights when power goes off
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.secure.pack-switches-check
    text: PACK SWITCHES
    expect: "OFF"
    controls:
      - packs
    targets:
      - at: "oh/bleed/L PACK/1"
        set: "OFF"
      - at: "oh/bleed/R PACK/1"
        set: "OFF"
    why: Stops the packs before the air source goes off
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.secure.apu-or-ground-power-check
    text: APU OR GROUND POWER
    expect: "OFF"
    controls:
      - apub
    targets:
      - at: "oh/elecl/GEN 1/1"
        set: "OFF"
      - at: "oh/elecl/APU GEN/1"
        set: "OFF"
      - at: "oh/elecl/APU GEN/2"
        set: "OFF"
      - at: "oh/elecl/GEN 2/1"
        set: "OFF"
    note: Do this just before the battery goes off.
    why: Removes AC power from the airplane
    panel_lights:
      apub:
        - APU GEN
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
  - id: ifly-737-max8.secure.battery-check
    text: BATTERY
    expect: "OFF"
    controls:
      - bat
    targets:
      - at: "oh/elecu/BATTERY/1"
        set: "OFF"
    note: The last switch.
    why: Stops battery drain
    confirmed_by:
      - kind: vendor-docs
        date: 2026-11-09
