#
# yaml-language-server: $schema=../../../schemas/panel.schema.json
# Generated by tools/import-3x. Resting positions (`rest`) follow 3.0's defaults, corrected to
# 3.0's measured cold and dark panel state.
id: con
title: Center console
width: 898
height: 1475
sections:
  - id: cdul
    title: Left CDU
    x: 10
    "y": 6
    width: 210
    height: 120
    items:
      - kind: display_unit
        label: CDU
        x: 105
        "y": 64
        controls:
          - cdu
          - vref
          - fmc
        description: Flight management entry.
        width: 170
        height: 84
  - id: ed
    title: Engine display and autobrake
    x: 226
    "y": 6
    width: 448
    height: 206
    items:
      - kind: toggle_switch
        label: FUEL FLOW
        x: 58
        "y": 56
        controls:
          - fuelflow
        positions: "RESET, RATE, USED"
        rest: "RATE"
        description: "RATE shows flow, USED shows fuel used, RESET zeroes the count."
      - kind: selector
        label: SELECTOR L
        x: 58
        "y": 141
        controls:
          - sel
        positions: "L, C, R"
        rest: "L"
        description: Left display selector.
      - kind: light
        label: AUTO BRAKE DISARM
        color: amber
        x: 157
        "y": 30
        controls:
          - abrake
        description: Autobrake disarmed or faulty. Lights 1 to 2 seconds when RTO is selected.
      - kind: selector
        label: AUTO BRAKE
        x: 157
        "y": 87
        controls:
          - abrake
        positions: "RTO, OFF, 1, 2, 3, MAX"
        rest: "RTO"
        description: Sets the autobrake.
      - kind: push_button
        label: ENG
        x: 313
        "y": 30
        controls:
          - engmon
          - oil
        description: Shows secondary engine data.
      - kind: push_button
        label: SYS
        x: 379
        "y": 30
        controls:
          - sysp
        description: Shows system data.
      - kind: push_button
        label: INFO
        x: 313
        "y": 84
        description: Information display.
      - kind: push_button
        label: C/R
        x: 379
        "y": 84
        controls:
          - cr
        description: Cancel and recall alerts.
        height: 26
      - kind: selector
        label: SELECTOR R
        x: 373
        "y": 146
        controls:
          - sel
        positions: "L, C, R"
        rest: "L"
        description: Right display selector.
        height: 26
      - kind: light
        label: ANTISKID INOP
        color: amber
        x: 157
        "y": 152
        description: Antiskid fault. Antiskid is off for one or more wheels.
      - kind: light
        label: BRAKE TEMP
        color: amber
        x: 237
        "y": 30
        description: A brake is hot.
      - kind: light
        label: TIRE PRESS
        color: amber
        x: 237
        "y": 70
        description: Tire pressure is low.
      - kind: push_button
        label: ENG TFR
        x: 237
        "y": 126
        description: Moves the engine display to the other screen.
  - id: cdur
    title: Right CDU
    x: 678
    "y": 6
    width: 210
    height: 120
    items:
      - kind: display_unit
        label: CDU
        x: 105
        "y": 64
        controls:
          - cdu
          - vref
          - fmc
        description: Flight management entry.
        width: 170
        height: 84
  - id: st
    title: Control stand
    x: 10
    "y": 216
    width: 680
    height: 250
    items:
      - kind: display_unit
        label: STAB TRIM WHEEL
        x: 40
        "y": 120
        controls:
          - stabind
          - stabwheel
        description: Shows and sets stabilizer trim.
        width: 48
        height: 190
      - kind: lever
        label: SPEEDBRAKE LEVER
        x: 150
        "y": 120
        controls:
          - speedbrake
        positions: "DOWN, ARMED, FLIGHT, UP"
        rest: "DOWN"
        description: Raises the spoilers.
      - kind: display_unit
        label: THRUST LEVERS 1 AND 2
        x: 330
        "y": 70
        controls:
          - thrust
        description: Set thrust. Reverse levers sit on top.
        width: 220
        height: 92
      - kind: push_button
        label: TO/GA
        x: 262
        "y": 154
        controls:
          - toga
        description: Takeoff and go-around.
      - kind: push_button
        label: A/T DISENGAGE
        x: 398
        "y": 154
        controls:
          - apdisc
        description: Disconnects the autothrottle.
      - kind: lever
        label: FLAP LEVER
        x: 532
        "y": 120
        controls:
          - flaplever
        positions: "UP, 1, 2, 5, 10, 15, 25, 30, 40"
        rest: "UP"
        description: Sets the flaps.
      - kind: display_unit
        label: STAB TRIM WHEEL
        x: 640
        "y": 120
        controls:
          - stabind
          - stabwheel
        description: Shows and sets stabilizer trim.
        width: 48
        height: 190
  - id: lo
    title: Parking brake and start levers
    x: 10
    "y": 470
    width: 771
    height: 130
    items:
      - kind: handle
        label: PARKING BRAKE
        x: 88
        "y": 50
        controls:
          - pbrake
        positions: "RELEASED, SET"
        rest: "SET"
        description: Red handle.
      - kind: light
        label: PARK BRAKE LIGHT
        color: red
        x: 189
        "y": 52
        controls:
          - pbrake
        lit_at: SET
        description: The parking brake is holding the airplane.
      - kind: lever
        label: START LEVER 1
        x: 301
        "y": 50
        controls:
          - slever
        positions: "IDLE, CUTOFF"
        rest: "CUTOFF"
        description: Fuel to engine 1.
      - kind: lever
        label: START LEVER 2
        x: 391
        "y": 50
        controls:
          - slever
        positions: "IDLE, CUTOFF"
        rest: "CUTOFF"
        description: Fuel to engine 2.
      - kind: push_button
        label: HORN CUTOUT
        x: 346
        "y": 102
        description: Silences the gear horn.
      - kind: toggle_switch
        label: STAB TRIM PRI
        x: 605
        "y": 50
        controls:
          - stabcut
        positions: "NORMAL, CUT OUT"
        rest: "NORMAL"
        description: Either switch cuts all electric stabilizer trim.
      - kind: toggle_switch
        label: STAB TRIM B/U
        x: 684
        "y": 50
        controls:
          - stabcut
        positions: "NORMAL, CUT OUT"
        rest: "NORMAL"
        description: Either switch cuts all electric stabilizer trim.
  - id: fi
    title: Fire protection
    x: 10
    "y": 604
    width: 786
    height: 174
    items:
      - kind: toggle_switch
        label: OVHT DET 1
        x: 52
        "y": 47
        positions: "A, NORMAL, B"
        rest: "NORMAL"
        description: "Selects loop A, B, or both (NORMAL) for engine 1."
      - kind: light
        label: ENG 1 OVERHEAT
        color: amber
        x: 52
        "y": 92
        description: "The detectors around engine 1 sense more heat than normal, but not a fire."
      - kind: toggle_switch
        label: FIRE TEST
        x: 52
        "y": 140
        controls:
          - firetest
        positions: "FAULT/INOP, OVHT/FIRE"
        description: Tests the fire warnings.
      - kind: handle
        label: FIRE 1
        x: 149
        "y": 81
        controls:
          - firesw
        positions: "PULL, ROTATE L, R"
        description: Engine 1 fire switch.
      - kind: light
        label: FAULT
        color: amber
        x: 252
        "y": 41
        description: Both detector loops of an engine have failed.
      - kind: light
        label: APU DET INOP
        color: amber
        x: 252
        "y": 81
        description: "The APU fire detector loop has failed, so an APU fire may not be detected."
      - kind: light
        label: APU BOTTLE DISCHARGE
        color: amber
        x: 252
        "y": 122
        description: The APU fire bottle is empty or has lost pressure.
      - kind: push_button
        label: BELL CUTOUT
        x: 351
        "y": 34
        description: Silences the fire warning bell.
      - kind: handle
        label: FIRE APU
        x: 351
        "y": 99
        controls:
          - apufire
        positions: "PULL, ROTATE"
        description: APU fire switch.
      - kind: toggle_switch
        label: OVHT DET 2
        x: 445
        "y": 47
        positions: "A, NORMAL, B"
        rest: "NORMAL"
        description: "Selects loop A, B, or both (NORMAL) for engine 2."
      - kind: light
        label: ENG 2 OVERHEAT
        color: amber
        x: 445
        "y": 92
        description: "The detectors around engine 2 sense more heat than normal, but not a fire."
      - kind: handle
        label: FIRE 2
        x: 542
        "y": 81
        controls:
          - firesw
        positions: "PULL, ROTATE L, R"
        description: Engine 2 fire switch.
      - kind: light
        label: L BOTTLE DISCHARGE
        color: amber
        x: 632
        "y": 34
        description: The left engine fire bottle has been fired or has lost pressure.
      - kind: light
        label: R BOTTLE DISCHARGE
        color: amber
        x: 708
        "y": 34
        description: The right engine fire bottle has been fired or has lost pressure.
      - kind: toggle_switch
        label: EXT TEST
        x: 670
        "y": 83
        controls:
          - exttest
        positions: "1, 2"
        description: Tests the extinguisher bottle circuits.
      - kind: light
        label: L
        color: amber
        x: 618
        "y": 133
        description: Green during the extinguisher test.
      - kind: light
        label: R
        color: amber
        x: 680
        "y": 133
        description: Green during the extinguisher test.
      - kind: light
        label: APU
        color: amber
        x: 742
        "y": 133
        description: Green during the extinguisher test.
  - id: r1
    title: Radio 1
    x: 10
    "y": 782
    width: 222
    height: 112
    items:
      - kind: display_unit
        label: VHF RADIO 1
        x: 111
        "y": 48
        controls:
          - radios
          - atcclr
          - clear
        description: Active and standby frequencies.
        width: 170
        height: 44
  - id: cf
    title: Cargo fire
    x: 238
    "y": 782
    width: 339
    height: 149
    items:
      - kind: light
        label: EXT FWD
        color: amber
        x: 47
        "y": 42
        description: Green during the cargo fire test.
        width: 38
        height: 26
      - kind: light
        label: EXT AFT
        color: amber
        x: 116
        "y": 42
        description: Green during the cargo fire test.
        width: 38
        height: 26
      - kind: toggle_switch
        label: DET FWD
        x: 175
        "y": 42
        positions: "A, NORM, B"
        rest: "NORM"
        description: Forward detector select.
        width: 38
        height: 26
      - kind: toggle_switch
        label: DET AFT
        x: 222
        "y": 42
        positions: "A, NORM, B"
        rest: "NORM"
        description: Aft detector select.
        width: 38
        height: 26
      - kind: light
        label: DETECTOR FAULT
        color: amber
        x: 281
        "y": 42
        description: "One or more selected detection loops in a hold has failed, so detection there may be reduced."
        width: 42
        height: 26
      - kind: push_button
        label: TEST
        x: 51
        "y": 92
        controls:
          - cargofire
        description: Tests the cargo fire system.
        width: 40
        height: 28
      - kind: push_button
        label: ARM FWD
        x: 127
        "y": 92
        controls:
          - cargofire
        description: Arms the forward compartment.
        width: 46
        height: 28
      - kind: push_button
        label: ARM AFT
        x: 192
        "y": 92
        controls:
          - cargofire
        description: Arms the aft compartment.
        width: 46
        height: 28
      - kind: push_button
        label: DISCH
        x: 265
        "y": 92
        controls:
          - cargofire
        description: Discharges the bottle into the armed compartment.
        width: 46
        height: 28
  - id: r2
    title: Radio 2
    x: 581
    "y": 782
    width: 222
    height: 112
    items:
      - kind: display_unit
        label: VHF RADIO 2
        x: 111
        "y": 48
        controls:
          - radios
        description: Active and standby frequencies.
        width: 170
        height: 44
  - id: n1
    title: NAV 1
    x: 10
    "y": 898
    width: 222
    height: 84
    items:
      - kind: display_unit
        label: NAV 1
        x: 111
        "y": 48
        controls:
          - mmr
        description: Multi-mode receiver.
        width: 170
        height: 44
  - id: wx
    title: Weather radar
    x: 238
    "y": 935
    width: 224
    height: 84
    items:
      - kind: display_unit
        label: WXR PANEL
        x: 112
        "y": 48
        controls:
          - wxrp
        description: Not simulated.
        width: 170
        height: 44
  - id: n2
    title: NAV 2
    x: 468
    "y": 935
    width: 222
    height: 84
    items:
      - kind: display_unit
        label: NAV 2
        x: 111
        "y": 48
        controls:
          - mmr
        description: Multi-mode receiver.
        width: 170
        height: 44
  - id: a1
    title: Audio 1
    x: 10
    "y": 986
    width: 222
    height: 84
    items:
      - kind: display_unit
        label: AUDIO PANEL 1
        x: 111
        "y": 48
        controls:
          - audio
          - pa
        description: Radio and intercom audio.
        width: 170
        height: 44
  - id: atc
    title: ATC/TCAS
    x: 238
    "y": 1023
    width: 310
    height: 151
    items:
      - kind: selector
        label: ALT SOURCE 1
        x: 46
        "y": 35
        controls:
          - xpndr
        positions: "1, 2"
        rest: "1"
        description: Chooses which air data source sends altitude to the transponder.
      - kind: toggle_switch
        label: XPNDR
        x: 112
        "y": 68
        controls:
          - xpndr
        positions: "STBY, AUTO"
        rest: "STBY"
        description: Transponder.
      - kind: display_unit
        label: CODE
        x: 177
        "y": 68
        controls:
          - xpndr
        description: Squawk code.
        width: 48
        height: 30
      - kind: selector
        label: MODE
        x: 253
        "y": 68
        controls:
          - xpndr
        positions: "ALT OFF, XPNDR, TA ONLY, TA/RA"
        rest: "ALT OFF"
        description: TCAS and transponder mode.
      - kind: selector
        label: ALT SOURCE 2
        x: 46
        "y": 106
        controls:
          - xpndr
        positions: "1, 2"
        rest: "1"
        description: Second altitude source selector.
  - id: a2
    title: Audio 2
    x: 552
    "y": 1023
    width: 222
    height: 84
    items:
      - kind: display_unit
        label: AUDIO PANEL 2
        x: 111
        "y": 48
        controls:
          - audio
          - pa
        description: Radio and intercom audio.
        width: 170
        height: 44
  - id: r3
    title: Radio 3
    x: 10
    "y": 1074
    width: 222
    height: 60
    items:
      - kind: display_unit
        label: VHF RADIO 3
        x: 111
        "y": 36
        description: Third radio.
        width: 170
        height: 28
  - id: adf
    title: ADF
    x: 238
    "y": 1178
    width: 454
    height: 96
    items:
      - kind: readout
        label: ADF 1
        x: 130
        "y": 30
        controls:
          - adf
        description: ADF receivers.
      - kind: readout
        label: ADF 2
        x: 324
        "y": 30
        controls:
          - adf
        description: ADF 2 frequency.
      - kind: selector
        label: ADF 1 TUNE
        x: 50
        "y": 40
        controls:
          - adf
        description: Tunes ADF 1.
      - kind: selector
        label: ADF 2 TUNE
        x: 404
        "y": 40
        controls:
          - adf
        description: Tunes ADF 2.
      - kind: selector
        label: TONE
        x: 227
        "y": 40
        controls:
          - adf
        positions: "1, OFF, 2"
        rest: "OFF"
        description: "ADF select knob: chooses which receiver you hear (OFF, 1 or 2)."
      - kind: selector
        label: ADF 1 MODE
        x: 170
        "y": 74
        controls:
          - adf
        positions: "ADF, ANT, OFF"
        rest: "ADF"
        description: ADF 1 mode. TEST button in the center.
      - kind: selector
        label: ADF 2 MODE
        x: 284
        "y": 74
        controls:
          - adf
        positions: "ADF, ANT, OFF"
        rest: "ADF"
        description: ADF 2 mode. TEST button in the center.
  - id: lp
    title: Lighting
    x: 10
    "y": 1138
    width: 222
    height: 130
    items:
      - kind: selector
        label: FLOOD
        x: 60
        "y": 66
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Flood lights.
      - kind: selector
        label: PANEL
        x: 160
        "y": 66
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel lights.
  - id: tr
    title: Trim
    x: 238
    "y": 1278
    width: 325
    height: 191
    items:
      - kind: readout
        label: RUDDER TRIM
        x: 150
        "y": 22
        description: "Rudder trim position indicator, in units nose left or right."
        width: 110
        height: 18
      - kind: toggle_switch
        label: AILERON
        x: 78
        "y": 116
        controls:
          - trimp
        positions: "LEFT, RIGHT WING DOWN"
        description: Aileron trim.
      - kind: selector
        label: RUDDER
        x: 223
        "y": 116
        controls:
          - trimp
        positions: "NOSE LEFT, NOSE RIGHT"
        description: Rudder trim.
  - id: dr
    title: Stab override and door
    x: 567
    "y": 1278
    width: 222
    height: 130
    items:
      - kind: toggle_switch
        label: STAB TRIM OVRD
        guarded: true
        x: 60
        "y": 69
        controls:
          - staboverride
        positions: "NORM, OVRD"
        rest: "NORM"
        description: OVRD restores electric trim when the column cutout has stopped it. Guarded at NORM.
      - kind: selector
        label: FLT DK DOOR
        x: 160
        "y": 69
        controls:
          - fdd
        positions: "UNLKD, AUTO, DENY"
        rest: "AUTO"
        description: Flight deck door.
