# yaml-language-server: $schema=../../../schemas/panel.schema.json
# Generated by tools/import-3x. Resting positions (`rest`) follow 3.0's defaults, corrected to
# 3.0's measured cold and dark panel state.
id: gl
title: Glareshield
width: 1501
height: 240
sections:
  - id: efisl
    title: Captain EFIS
    x: 10
    "y": 6
    width: 220
    height: 228
    items:
      - kind: selector
        label: MINS
        x: 50
        "y": 50
        controls:
          - mins
          - efispanel
        positions: "RADIO, BARO"
        rest: "RADIO"
        description: Outer ring selects RADIO or BARO. Inner knob sets minimums. Center button is RST.
      - kind: selector
        label: BARO
        x: 170
        "y": 50
        controls:
          - baro
          - efispanel
        positions: "IN, HPA, STD"
        rest: "IN"
        description: Inner knob sets the altimeter. Outer ring selects IN or HPA. Center button is STD.
      - kind: push_button
        label: FPV
        x: 110
        "y": 28
        description: Shows the flight path symbol on the PFD.
      - kind: push_button
        label: MTRS
        x: 110
        "y": 62
        description: Shows altitude in meters.
      - kind: selector
        label: MODE
        x: 50
        "y": 120
        controls:
          - efispanel
        positions: "APP, VOR, MAP, PLN"
        rest: "APP"
        description: ND mode. CTR centers it.
      - kind: selector
        label: RANGE
        x: 170
        "y": 120
        controls:
          - efispanel
        positions: ND range
        rest: "ND range"
        description: ND range. TFC shows traffic.
      - kind: push_button
        label: VSD
        x: 110
        "y": 120
        description: Shows the vertical profile below the ND.
      - kind: push_button
        label: WXR
        x: 40
        "y": 170
        controls:
          - efispanel
        description: Shows weather on the ND.
      - kind: push_button
        label: TERR
        x: 110
        "y": 170
        controls:
          - efispanel
        description: Shows terrain on the ND.
      - kind: push_button
        label: POS
        x: 180
        "y": 170
        controls:
          - efispanel
        description: Shows position data.
      - kind: push_button
        label: STA
        x: 40
        "y": 206
        controls:
          - efispanel
        description: Shows navaids on the map.
      - kind: push_button
        label: WPT
        x: 110
        "y": 206
        controls:
          - efispanel
        description: Shows waypoints.
      - kind: push_button
        label: ARPT
        x: 180
        "y": 206
        controls:
          - efispanel
        description: Shows airports.
  - id: annl
    title: Left annunciators
    x: 236
    "y": 6
    width: 177
    height: 139
    items:
      - kind: push_button
        label: FLT CONT
        x: 31
        "y": 92
        controls:
          - recall
        description: Lights with MASTER CAUTION for a FLT CONT caution. Press to recall stored cautions.
        width: 42
        height: 24
      - kind: push_button
        label: IRS
        x: 87
        "y": 92
        controls:
          - recall
        description: Lights with MASTER CAUTION for a IRS caution. Press to recall stored cautions.
        width: 42
        height: 24
      - kind: push_button
        label: FUEL
        x: 143
        "y": 92
        controls:
          - recall
        description: Lights with MASTER CAUTION for a FUEL caution. Press to recall stored cautions.
        width: 42
        height: 24
      - kind: push_button
        label: ELEC
        x: 31
        "y": 120
        controls:
          - recall
        description: Lights with MASTER CAUTION for a ELEC caution. Press to recall stored cautions.
        width: 42
        height: 24
      - kind: push_button
        label: APU
        x: 87
        "y": 120
        controls:
          - recall
        description: Lights with MASTER CAUTION for a APU caution. Press to recall stored cautions.
        width: 42
        height: 24
      - kind: push_button
        label: OVHT/DET
        x: 143
        "y": 120
        controls:
          - recall
        description: Lights with MASTER CAUTION for a OVHT/DET caution. Press to recall stored cautions.
        width: 42
        height: 24
      - kind: push_button
        label: FIRE WARN
        x: 31
        "y": 64
        description: Fire warning. Push to silence the bell and reset.
        width: 54
        height: 34
      - kind: push_button
        label: MASTER CAUTION
        x: 143
        "y": 64
        description: "Master caution. Push to reset; the six-pack shows which system."
        width: 54
        height: 34
  - id: mcp
    title: Mode control panel
    x: 417
    "y": 6
    width: 669
    height: 228
    items:
      - kind: selector
        label: COURSE
        x: 30
        "y": 60
        controls:
          - crs
        description: Sets the left course.
      - kind: toggle_switch
        label: F/D L
        x: 30
        "y": 130
        controls:
          - fd
        positions: "ON, OFF"
        rest: "OFF"
        description: Left flight director.
      - kind: toggle_switch
        label: A/T ARM
        x: 91
        "y": 60
        controls:
          - mcpset
        positions: "ARM, OFF"
        rest: "OFF"
        description: Arms the autothrottle.
      - kind: push_button
        label: N1
        x: 91
        "y": 130
        description: Autothrottle N1 mode.
      - kind: selector
        label: IAS/MACH
        x: 151
        "y": 60
        controls:
          - mcpset
        description: Sets speed.
      - kind: push_button
        label: SPEED
        x: 151
        "y": 130
        description: Autothrottle speed mode.
      - kind: push_button
        label: VNAV
        x: 212
        "y": 60
        controls:
          - pitchmode
        description: Vertical navigation.
      - kind: push_button
        label: LVL CHG
        x: 212
        "y": 130
        controls:
          - pitchmode
        description: Climbs or descends to the MCP altitude at the MCP speed.
      - kind: selector
        label: HEADING
        x: 277
        "y": 60
        controls:
          - hdgsel
          - mcpset
        positions: Bank 10 to 30
        rest: "Bank 10 to 30"
        description: Sets heading. The outer ring limits bank.
      - kind: push_button
        label: HDG SEL
        x: 277
        "y": 130
        controls:
          - rollmode
        description: Heading select.
      - kind: push_button
        label: LNAV
        x: 342
        "y": 50
        controls:
          - rollmode
        description: Lateral navigation.
      - kind: push_button
        label: VOR LOC
        x: 342
        "y": 90
        controls:
          - rollmode
        description: Tracks a VOR or localizer.
      - kind: push_button
        label: APP
        x: 342
        "y": 130
        controls:
          - appmode
          - rollmode
        description: Approach mode.
      - kind: selector
        label: ALTITUDE
        x: 406
        "y": 60
        controls:
          - mcpalt
          - mcpset
        description: Sets the cleared altitude.
      - kind: push_button
        label: ALT HLD
        x: 406
        "y": 130
        controls:
          - mcpalt
        description: Holds altitude.
      - kind: push_button
        label: V/S
        x: 463
        "y": 130
        description: Holds the vertical speed set in the V/S window.
      - kind: push_button
        label: CMD A
        x: 506
        "y": 50
        controls:
          - ap
        description: Engages autopilot A.
      - kind: push_button
        label: CMD B
        x: 562
        "y": 50
        controls:
          - ap
        description: Engages autopilot B.
      - kind: push_button
        label: CWS A
        x: 506
        "y": 90
        description: Autopilot holds the attitude you set with the control wheel.
      - kind: push_button
        label: CWS B
        x: 562
        "y": 90
        description: Autopilot holds the attitude you set with the control wheel.
      - kind: toggle_switch
        label: F/D R
        x: 625
        "y": 130
        controls:
          - fd
        positions: "ON, OFF"
        rest: "OFF"
        description: Right flight director.
      - kind: toggle_switch
        label: DISENGAGE
        guarded: true
        x: 534
        "y": 130
        controls:
          - apdis
        positions: "UP, DOWN"
        rest: "UP"
        description: Autopilot disengage bar.
      - kind: selector
        label: COURSE
        x: 625
        "y": 60
        controls:
          - crs
        description: Sets the right course.
