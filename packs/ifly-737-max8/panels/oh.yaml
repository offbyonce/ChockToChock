id: oh
title: Forward overhead
width: 1344
height: 1682
sections:
  - id: fctl
    title: Flight control
    x: 10
    "y": 6
    width: 263
    height: 348
    items:
      - kind: toggle_switch
        label: FLT CONTROL A
        guarded: true
        x: 54
        "y": 64
        controls:
          - fltctrl
        positions: "STBY RUD, OFF, A ON"
        rest: "STBY RUD"
        description: "Gives hydraulic system A to the ailerons, elevator and rudder."
      - kind: toggle_switch
        label: FLT CONTROL B
        guarded: true
        x: 124
        "y": 64
        controls:
          - fltctrl
        positions: "STBY RUD, OFF, B ON"
        rest: "STBY RUD"
        description: "Gives hydraulic system B to the ailerons, elevator and rudder."
      - kind: light
        label: LOW QUANTITY
        color: amber
        x: 212
        "y": 34
        controls:
          - stbyhyd
        description: The standby hydraulic reservoir is running low on fluid.
      - kind: light
        label: LOW PRESSURE
        color: amber
        x: 212
        "y": 62
        controls:
          - stbyhyd
        description: The standby hydraulic pump is selected to run but is not giving pressure.
      - kind: light
        label: STBY RUD ON
        color: amber
        x: 212
        "y": 89
        controls:
          - stbyhyd
        description: "The standby hydraulic system is powering the rudder, because a flight control switch is at STBY RUD or it switched on by itself."
      - kind: light
        label: LOW PRESSURE
        color: amber
        x: 52
        "y": 129
        controls:
          - fctllts
        description: System A flight control pressure is low.
      - kind: light
        label: LOW PRESSURE
        color: amber
        x: 116
        "y": 129
        controls:
          - fctllts
        description: System B flight control pressure is low.
      - kind: toggle_switch
        label: ALT FLAPS MASTER
        guarded: true
        x: 164
        "y": 138
        controls:
          - altflap
        positions: "OFF, ARM"
        rest: "OFF"
        description: Arms alternate flap operation. Red guard.
      - kind: toggle_switch
        label: ALT FLAPS
        x: 223
        "y": 140
        controls:
          - altflap
        positions: "UP, OFF, DOWN"
        rest: "OFF"
        description: Moves the flaps electrically when armed.
      - kind: toggle_switch
        label: SPOILER A
        guarded: true
        x: 54
        "y": 199
        controls:
          - spoilsw
        positions: "OFF, ON"
        rest: "OFF"
        description: Hydraulic system A to the flight spoilers.
      - kind: toggle_switch
        label: SPOILER B
        guarded: true
        x: 124
        "y": 199
        controls:
          - spoilsw
        positions: "OFF, ON"
        rest: "OFF"
        description: Hydraulic system B to the flight spoilers.
      - kind: light
        label: FEEL DIFF PRESS
        color: amber
        x: 212
        "y": 193
        controls:
          - fctllts
        description: "The elevator feel computer senses too big a pressure difference between its two hydraulic inputs, so the column feel may be wrong."
      - kind: light
        label: SPEED TRIM FAIL
        color: amber
        x: 212
        "y": 220
        controls:
          - fctllts
        description: "The speed trim system has failed. On the MAX this covers both speed trim and MCAS: if one fails, the other is switched off too."
      - kind: light
        label: MACH TRIM FAIL
        color: amber
        x: 212
        "y": 246
        controls:
          - fctllts
        description: "Mach trim, which stops the nose tucking down at high Mach, is not working."
      - kind: light
        label: AUTO SLAT FAIL
        color: amber
        x: 212
        "y": 273
        controls:
          - fctllts
        description: The system that moves the slats to full extend near the stall is not working.
      - kind: light
        label: SPOILERS
        color: amber
        x: 212
        "y": 299
        controls:
          - fctllts
        description: "A fault in spoiler control, so some spoilers may not move."
      - kind: light
        label: YAW DAMPER
        color: amber
        x: 84
        "y": 279
        controls:
          - yawd
        description: "Nothing is damping Dutch roll, because the yaw damper is not engaged."
      - kind: toggle_switch
        label: YAW DAMPER
        x: 84
        "y": 318
        controls:
          - yawd
        positions: "OFF, ON"
        rest: "OFF"
        description: Damps Dutch roll.
