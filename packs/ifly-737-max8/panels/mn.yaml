#
# yaml-language-server: $schema=../../../schemas/panel.schema.json
# Generated by tools/import-3x. Resting positions (`rest`) follow 3.0's defaults, corrected to
# 3.0's measured cold and dark panel state.
id: mn
title: Main panel
width: 1000
height: 430
sections:
  - id: cl
    title: Captain lights
    x: 10
    "y": 6
    width: 434
    height: 96
    items:
      - kind: light
        label: BELOW G/S
        color: amber
        x: 28
        "y": 40
        description: The airplane has gone well below the glideslope on the approach.
      - kind: light
        label: TAKEOFF CONFIG
        color: red
        x: 76
        "y": 40
        description: "When thrust went up for takeoff, an item such as the flaps, speedbrake, stabilizer trim or parking brake was not set for takeoff."
      - kind: light
        label: CABIN ALTITUDE
        color: red
        x: 124
        "y": 40
        description: "The cabin altitude has climbed above about 10,000 ft."
      - kind: toggle_switch
        label: A/P A/T TEST
        x: 222
        "y": 22
        controls:
          - ltest
        positions: "1, 2"
        description: Tests the disengage lights.
      - kind: toggle_switch
        label: LIGHTS
        x: 356
        "y": 26
        controls:
          - ltest
        positions: "TEST, BRT, DIM"
        rest: "BRT"
        description: Tests the lights and sets brightness.
      - kind: light
        label: SPEED BRAKE DO NOT ARM
        color: amber
        x: 310
        "y": 64
        description: Automatic speedbrake fault. Arm only by hand after landing.
      - kind: light
        label: STAB OUT OF TRIM
        color: amber
        x: 356
        "y": 64
        controls:
          - stabout
        description: The autopilot is not trimming correctly.
      - kind: light
        label: SPEED BRAKE ARMED
        color: green
        x: 402
        "y": 64
        controls:
          - speedbrake
        description: The speedbrake is armed and will deploy by itself on touchdown.
      - kind: light
        label: A/P
        color: amber
        x: 196
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: A/T
        color: amber
        x: 222
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: FMC
        color: amber
        x: 248
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
  - id: cd
    title: Captain displays
    x: 10
    "y": 94
    width: 434
    height: 226
    items:
      - kind: display_unit
        label: "OUTBOARD DU: PFD"
        x: 110
        "y": 118
        controls:
          - fltinst
          - speedt
          - fma
          - pfdhdg
        description: Primary flight display.
        width: 190
        height: 170
      - kind: display_unit
        label: "INBOARD DU: ND AND ENGINES"
        x: 320
        "y": 118
        controls:
          - fltinst
          - n1
          - engmon
          - motor
          - oil
          - fuelq
        description: Navigation display and engine indications.
        width: 190
        height: 170
  - id: ctr
    title: Standby and gear
    x: 450
    "y": 6
    width: 104
    height: 404
    items:
      - kind: display_unit
        label: STANDBY DISPLAY
        x: 52
        "y": 54
        controls:
          - isfdc
        description: "Standby attitude, speed and altitude."
        width: 84
        height: 76
      - kind: light
        label: LEFT GEAR
        color: red
        x: 13
        "y": 134
        description: "The left main gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
        width: 42
        height: 0
      - kind: light
        label: NOSE GEAR
        color: red
        x: 52
        "y": 108
        description: "The nose gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
        width: 42
        height: 0
      - kind: light
        label: RIGHT GEAR
        color: red
        x: 91
        "y": 134
        description: "The right main gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
        width: 42
        height: 0
      - kind: light
        label: LEFT GEAR
        color: green
        x: 13
        "y": 160
        controls:
          - gearlever
        description: The left main gear is down and locked.
        width: 42
        height: 0
      - kind: light
        label: NOSE GEAR
        color: green
        x: 52
        "y": 134
        controls:
          - gearlever
        description: The nose gear is down and locked.
        width: 42
        height: 0
      - kind: light
        label: RIGHT GEAR
        color: green
        x: 91
        "y": 160
        controls:
          - gearlever
        description: The right main gear is down and locked.
        width: 42
        height: 0
      - kind: toggle_switch
        label: LANDING GEAR LEVER
        guarded: true
        x: 24
        "y": 266
        controls:
          - gearlever
          - gearup
        positions: "UP, DN"
        rest: "DN"
        description: Raises and lowers the gear.
      - kind: push_button
        label: LOCK OVRD
        x: 56
        "y": 236
        description: Lets the gear lever go UP when the ground lock holds it.
      - kind: toggle_switch
        label: NOSE WHEEL STEER ALT
        guarded: true
        x: 88
        "y": 268
        controls:
          - nws
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM, which steers with system A. ALT uses system B."
  - id: fl
    title: First officer lights
    x: 560
    "y": 6
    width: 430
    height: 96
    items:
      - kind: light
        label: SPEEDBRAKES EXTENDED
        color: amber
        x: 30
        "y": 40
        description: Speedbrakes are out at the wrong time.
      - kind: toggle_switch
        label: A/P A/T TEST
        x: 156
        "y": 22
        controls:
          - ltest
        positions: "1, 2"
        description: Tests the disengage lights.
      - kind: light
        label: CABIN ALTITUDE
        color: red
        x: 306
        "y": 40
        description: "The cabin altitude has climbed above about 10,000 ft."
      - kind: light
        label: TAKEOFF CONFIG
        color: red
        x: 354
        "y": 40
        description: "When thrust went up for takeoff, an item such as the flaps, speedbrake, stabilizer trim or parking brake was not set for takeoff."
      - kind: light
        label: BELOW G/S
        color: amber
        x: 402
        "y": 40
        description: The airplane has gone well below the glideslope on the approach.
      - kind: light
        label: A/P
        color: amber
        x: 130
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: A/T
        color: amber
        x: 156
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: FMC
        color: amber
        x: 182
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
  - id: fd
    title: First officer displays
    x: 560
    "y": 94
    width: 430
    height: 226
    items:
      - kind: display_unit
        label: "INBOARD DU: ND"
        x: 110
        "y": 118
        controls:
          - fltinst
        description: Navigation display.
        width: 190
        height: 170
      - kind: display_unit
        label: "OUTBOARD DU: PFD"
        x: 320
        "y": 118
        controls:
          - fltinst
        description: Primary flight display.
        width: 190
        height: 170
  - id: clt
    title: Captain display select and lighting
    x: 10
    "y": 326
    width: 434
    height: 110
    items:
      - kind: selector
        label: MAIN PANEL
        x: 118
        "y": 34
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel brightness.
      - kind: selector
        label: PFD/MFD
        x: 188
        "y": 34
        controls:
          - dsel
        positions: "OUTBD, NORM, INBD"
        rest: "NORM"
        description: Moves the displays.
      - kind: selector
        label: BACKGROUND
        x: 262
        "y": 58
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Background brightness.
      - kind: selector
        label: AFDS FLOOD
        x: 346
        "y": 58
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Glareshield flood light.
      - kind: push_button
        label: FOOT AIR
        x: 18
        "y": 58
        description: Pull for foot air.
      - kind: push_button
        label: WINDSHIELD AIR
        x: 60
        "y": 58
        description: Pull for windshield air.
      - kind: selector
        label: OUTBD DU
        x: 118
        "y": 84
        description: Outboard display brightness.
      - kind: selector
        label: INBD DU
        x: 188
        "y": 84
        description: Inboard display brightness.
  - id: gp
    title: "Ground proximity, display select and air"
    x: 560
    "y": 326
    width: 430
    height: 110
    items:
      - kind: light
        label: GND PROX INOP
        color: amber
        x: 26
        "y": 26
        controls:
          - gpwssw
        description: "The ground proximity warning system has a fault, so terrain warnings may not work."
      - kind: push_button
        label: SYS TEST
        x: 26
        "y": 56
        controls:
          - gpwssw
        description: Runs the GPWS test.
      - kind: toggle_switch
        label: FLAP INHIBIT
        guarded: true
        x: 68
        "y": 52
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: GEAR INHIBIT
        guarded: true
        x: 112
        "y": 52
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: TERR INHIBIT
        guarded: true
        x: 156
        "y": 52
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: RUNWAY INHIBIT
        guarded: true
        x: 200
        "y": 52
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: selector
        label: PFD/MFD
        x: 254
        "y": 34
        controls:
          - dsel
        positions: "INBD, NORM, OUTBD"
        rest: "NORM"
        description: Moves the displays.
      - kind: selector
        label: MAIN PANEL
        x: 322
        "y": 34
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel brightness.
      - kind: light
        label: RUNWAY INOP
        color: amber
        x: 26
        "y": 88
        description: Runway awareness is inoperative.
      - kind: selector
        label: INBD DU
        x: 254
        "y": 84
        description: Inboard display brightness and contrast.
      - kind: selector
        label: OUTBD DU
        x: 322
        "y": 84
        description: Outboard display brightness and contrast.
      - kind: push_button
        label: WINDSHIELD AIR
        x: 376
        "y": 58
        description: Pull for windshield air.
      - kind: push_button
        label: FOOT AIR
        x: 416
        "y": 58
        description: Pull for foot air.
