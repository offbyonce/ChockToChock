#
# yaml-language-server: $schema=../../../schemas/panel.schema.json
# Generated by tools/import-3x. Resting positions (`rest`) follow 3.0's defaults, corrected to
# 3.0's measured cold and dark panel state.
id: mn
title: Main panel
width: 1442
height: 648
sections:
  - id: cl
    title: Captain lights
    x: 10
    "y": 6
    width: 561
    height: 135
    items:
      - kind: light
        label: BELOW G/S
        color: amber
        x: 43
        "y": 43
        description: The airplane has gone well below the glideslope on the approach.
      - kind: light
        label: TAKEOFF CONFIG
        color: red
        x: 109
        "y": 43
        description: "When thrust went up for takeoff, an item such as the flaps, speedbrake, stabilizer trim or parking brake was not set for takeoff."
      - kind: light
        label: CABIN ALTITUDE
        color: red
        x: 174
        "y": 43
        description: "The cabin altitude has climbed above about 10,000 ft."
      - kind: toggle_switch
        label: A/P A/T TEST
        x: 274
        "y": 22
        controls:
          - ltest
        positions: "1, 2"
        description: Tests the disengage lights.
      - kind: toggle_switch
        label: LIGHTS
        x: 434
        "y": 27
        controls:
          - ltest
        positions: "TEST, BRT, DIM"
        rest: "BRT"
        description: Tests the lights and sets brightness.
      - kind: light
        label: SPEED BRAKE DO NOT ARM
        color: amber
        x: 379
        "y": 72
        description: Automatic speedbrake fault. Arm only by hand after landing.
      - kind: light
        label: STAB OUT OF TRIM
        color: amber
        x: 444
        "y": 72
        controls:
          - stabout
        description: The autopilot is not trimming correctly.
      - kind: light
        label: SPEED BRAKE ARMED
        color: green
        x: 510
        "y": 72
        controls:
          - speedbrake
        description: The speedbrake is armed and will deploy by itself on touchdown.
      - kind: light
        label: A/P
        color: amber
        x: 243
        "y": 102
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: A/T
        color: amber
        x: 374
        "y": 102
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: FMC
        color: amber
        x: 309
        "y": 89
        description: "Autopilot, autothrottle and FMC alert light."
  - id: cd
    title: Captain displays
    x: 10
    "y": 145
    width: 434
    height: 226
    items:
      - kind: display_unit
        label: "OUTBOARD DU: PFD"
        x: 110
        "y": 118
        controls:
          - fltinst
          - speedt
          - fma
          - pfdhdg
        description: Primary flight display.
        width: 190
        height: 170
      - kind: display_unit
        label: "INBOARD DU: ND AND ENGINES"
        x: 320
        "y": 118
        controls:
          - fltinst
          - n1
          - engmon
          - motor
          - oil
          - fuelq
        description: Navigation display and engine indications.
        width: 190
        height: 170
  - id: ctr
    title: Standby and gear
    x: 575
    "y": 6
    width: 189
    height: 434
    items:
      - kind: display_unit
        label: STANDBY DISPLAY
        x: 76
        "y": 58
        controls:
          - isfdc
        description: "Standby attitude, speed and altitude."
        width: 84
        height: 76
      - kind: light
        label: LEFT GEAR
        color: red
        x: 35
        "y": 143
        description: "The left main gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
        width: 42
        height: 0
      - kind: light
        label: NOSE GEAR
        color: red
        x: 76
        "y": 115
        description: "The nose gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
        width: 42
        height: 0
      - kind: light
        label: RIGHT GEAR
        color: red
        x: 152
        "y": 143
        description: "The right main gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
        width: 42
        height: 0
      - kind: light
        label: LEFT GEAR
        color: green
        x: 35
        "y": 170
        controls:
          - gearlever
        description: The left main gear is down and locked.
        width: 42
        height: 0
      - kind: light
        label: NOSE GEAR
        color: green
        x: 93
        "y": 143
        controls:
          - gearlever
        description: The nose gear is down and locked.
        width: 42
        height: 0
      - kind: light
        label: RIGHT GEAR
        color: green
        x: 118
        "y": 170
        controls:
          - gearlever
        description: The right main gear is down and locked.
        width: 42
        height: 0
      - kind: lever
        label: LANDING GEAR LEVER
        x: 47
        "y": 283
        controls:
          - gearlever
          - gearup
        positions: "UP, DN"
        rest: "DN"
        description: Raises and lowers the gear.
      - kind: push_button
        label: LOCK OVRD
        x: 81
        "y": 251
        description: Lets the gear lever go UP when the ground lock holds it.
      - kind: toggle_switch
        label: NOSE WHEEL STEER ALT
        guarded: true
        x: 115
        "y": 285
        controls:
          - nws
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM, which steers with system A. ALT uses system B."
  - id: fl
    title: First officer lights
    x: 768
    "y": 6
    width: 448
    height: 96
    items:
      - kind: light
        label: SPEEDBRAKES EXTENDED
        color: amber
        x: 31
        "y": 40
        description: Speedbrakes are out at the wrong time.
      - kind: toggle_switch
        label: A/P A/T TEST
        x: 157
        "y": 22
        controls:
          - ltest
        positions: "1, 2"
        description: Tests the disengage lights.
      - kind: light
        label: CABIN ALTITUDE
        color: red
        x: 307
        "y": 40
        description: "The cabin altitude has climbed above about 10,000 ft."
      - kind: light
        label: TAKEOFF CONFIG
        color: red
        x: 362
        "y": 40
        description: "When thrust went up for takeoff, an item such as the flaps, speedbrake, stabilizer trim or parking brake was not set for takeoff."
      - kind: light
        label: BELOW G/S
        color: amber
        x: 417
        "y": 40
        description: The airplane has gone well below the glideslope on the approach.
      - kind: light
        label: A/P
        color: amber
        x: 131
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: A/T
        color: amber
        x: 241
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: FMC
        color: amber
        x: 186
        "y": 78
        description: "Autopilot, autothrottle and FMC alert light."
  - id: fd
    title: First officer displays
    x: 768
    "y": 145
    width: 430
    height: 226
    items:
      - kind: display_unit
        label: "INBOARD DU: ND"
        x: 110
        "y": 118
        controls:
          - fltinst
        description: Navigation display.
        width: 190
        height: 170
      - kind: display_unit
        label: "OUTBOARD DU: PFD"
        x: 320
        "y": 118
        controls:
          - fltinst
        description: Primary flight display.
        width: 190
        height: 170
  - id: clt
    title: Captain display select and lighting
    x: 10
    "y": 444
    width: 756
    height: 198
    items:
      - kind: selector
        label: MAIN PANEL
        x: 209
        "y": 34
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel brightness.
      - kind: selector
        label: PFD/MFD
        x: 321
        "y": 34
        controls:
          - dsel
        positions: "OUTBD, NORM, INBD"
        rest: "NORM"
        description: Moves the displays.
      - kind: selector
        label: BACKGROUND
        x: 439
        "y": 72
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Background brightness.
      - kind: selector
        label: AFDS FLOOD
        x: 573
        "y": 72
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Glareshield flood light.
      - kind: push_button
        label: FOOT AIR
        x: 50
        "y": 72
        description: Pull for foot air.
      - kind: push_button
        label: WINDSHIELD AIR
        x: 117
        "y": 72
        description: Pull for windshield air.
      - kind: selector
        label: OUTBD DU
        x: 209
        "y": 114
        description: Outboard display brightness.
      - kind: selector
        label: INBD DU
        x: 321
        "y": 114
        description: Inboard display brightness.
  - id: gp
    title: "Ground proximity, display select and air"
    x: 770
    "y": 444
    width: 662
    height: 179
    items:
      - kind: light
        label: GND PROX INOP
        color: amber
        x: 55
        "y": 30
        controls:
          - gpwssw
        description: "The ground proximity warning system has a fault, so terrain warnings may not work."
      - kind: push_button
        label: SYS TEST
        x: 55
        "y": 73
        controls:
          - gpwssw
        description: Runs the GPWS test.
      - kind: toggle_switch
        label: FLAP INHIBIT
        guarded: true
        x: 115
        "y": 67
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: GEAR INHIBIT
        guarded: true
        x: 177
        "y": 67
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: TERR INHIBIT
        guarded: true
        x: 239
        "y": 67
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: RUNWAY INHIBIT
        guarded: true
        x: 302
        "y": 67
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: selector
        label: PFD/MFD
        x: 378
        "y": 41
        controls:
          - dsel
        positions: "INBD, NORM, OUTBD"
        rest: "NORM"
        description: Moves the displays.
      - kind: selector
        label: MAIN PANEL
        x: 475
        "y": 41
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel brightness.
      - kind: light
        label: RUNWAY INOP
        color: amber
        x: 55
        "y": 118
        description: Runway awareness is inoperative.
      - kind: selector
        label: INBD DU
        x: 378
        "y": 112
        description: Inboard display brightness and contrast.
      - kind: selector
        label: OUTBD DU
        x: 475
        "y": 112
        description: Outboard display brightness and contrast.
      - kind: push_button
        label: WINDSHIELD AIR
        x: 551
        "y": 75
        description: Pull for windshield air.
      - kind: push_button
        label: FOOT AIR
        x: 608
        "y": 75
        description: Pull for foot air.
