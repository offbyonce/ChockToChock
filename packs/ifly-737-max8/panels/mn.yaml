#
# yaml-language-server: $schema=../../../schemas/panel.schema.json
# Generated by tools/import-3x. Resting positions (`rest`) follow 3.0's defaults, corrected to
# 3.0's measured cold and dark panel state.
id: mn
title: Main panel
width: 2027
height: 610
sections:
  - id: cl
    title: Captain lights
    x: 10
    "y": 6
    width: 918
    height: 109
    items:
      - kind: light
        label: BELOW G/S
        color: amber
        x: 31
        "y": 43
        description: The airplane has gone well below the glideslope on the approach.
      - kind: light
        label: TAKEOFF CONFIG
        color: red
        x: 136
        "y": 43
        description: "When thrust went up for takeoff, an item such as the flaps, speedbrake, stabilizer trim or parking brake was not set for takeoff."
      - kind: light
        label: CABIN ALTITUDE
        color: red
        x: 241
        "y": 43
        description: "The cabin altitude has climbed above about 10,000 ft."
      - kind: toggle_switch
        label: A/P A/T TEST
        x: 456
        "y": 22
        controls:
          - ltest
        positions: "1, 2"
        description: Tests the disengage lights.
      - kind: toggle_switch
        label: LIGHTS
        x: 750
        "y": 27
        controls:
          - ltest
        positions: "TEST, BRT, DIM"
        rest: "BRT"
        description: Tests the lights and sets brightness.
      - kind: light
        label: SPEED BRAKE DO NOT ARM
        color: amber
        x: 649
        "y": 71
        description: Automatic speedbrake fault. Arm only by hand after landing.
      - kind: light
        label: STAB OUT OF TRIM
        color: amber
        x: 750
        "y": 71
        controls:
          - stabout
        description: The autopilot is not trimming correctly.
      - kind: light
        label: SPEED BRAKE ARMED
        color: green
        x: 850
        "y": 71
        controls:
          - speedbrake
        lit_at: "ARMED"
        description: The speedbrake is armed and will deploy by itself on touchdown.
      - kind: light
        label: A/P
        color: amber
        x: 399
        "y": 88
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: A/T
        color: amber
        x: 456
        "y": 88
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: FMC
        color: amber
        x: 513
        "y": 88
        description: "Autopilot, autothrottle and FMC alert light."
  - id: cd
    title: Captain displays
    x: 10
    "y": 119
    width: 434
    height: 226
    items:
      - kind: display_unit
        label: "OUTBOARD DU: PFD"
        x: 110
        "y": 118
        controls:
          - fltinst
          - speedt
          - fma
          - pfdhdg
        description: Primary flight display.
        width: 190
        height: 170
      - kind: display_unit
        label: "INBOARD DU: ND AND ENGINES"
        x: 320
        "y": 118
        controls:
          - fltinst
          - n1
          - engmon
          - motor
          - oil
          - fuelq
        description: Navigation display and engine indications.
        width: 190
        height: 170
  - id: ctr
    title: Standby and gear
    x: 932
    "y": 6
    width: 174
    height: 408
    items:
      - kind: display_unit
        label: STANDBY DISPLAY
        x: 87
        "y": 58
        controls:
          - isfdc
        description: "Standby attitude, speed and altitude."
        width: 84
        height: 76
      - kind: light
        label: LEFT GEAR
        color: red
        x: 31
        "y": 138
        description: "The left main gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
      - kind: light
        label: NOSE GEAR
        color: red
        x: 87
        "y": 112
        description: "The nose gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
      - kind: light
        label: RIGHT GEAR
        color: red
        x: 142
        "y": 138
        description: "The right main gear is moving or not where the gear lever says, or it is not down and locked with a thrust lever at idle below 800 ft."
      - kind: light
        label: LEFT GEAR
        color: green
        x: 31
        "y": 164
        controls:
          - gearlever
        lit_at: "DN"
        description: The left main gear is down and locked.
      - kind: light
        label: NOSE GEAR
        color: green
        x: 87
        "y": 138
        controls:
          - gearlever
        lit_at: "DN"
        description: The nose gear is down and locked.
      - kind: light
        label: RIGHT GEAR
        color: green
        x: 142
        "y": 164
        controls:
          - gearlever
        lit_at: "DN"
        description: The right main gear is down and locked.
      - kind: lever
        label: LANDING GEAR LEVER
        x: 47
        "y": 270
        controls:
          - gearlever
          - gearup
        positions: "UP, DN"
        rest: "DN"
        description: Raises and lowers the gear.
      - kind: push_button
        label: LOCK OVRD
        x: 92
        "y": 240
        description: Lets the gear lever go UP when the ground lock holds it.
      - kind: toggle_switch
        label: NOSE WHEEL STEER ALT
        guarded: true
        x: 138
        "y": 272
        controls:
          - nws
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM, which steers with system A. ALT uses system B."
  - id: fl
    title: First officer lights
    x: 1110
    "y": 6
    width: 907
    height: 109
    items:
      - kind: light
        label: SPEEDBRAKES EXTENDED
        color: amber
        x: 31
        "y": 43
        description: Speedbrakes are out at the wrong time.
      - kind: toggle_switch
        label: A/P A/T TEST
        x: 307
        "y": 22
        controls:
          - ltest
        positions: "1, 2"
        description: Tests the disengage lights.
      - kind: light
        label: CABIN ALTITUDE
        color: red
        x: 636
        "y": 43
        description: "The cabin altitude has climbed above about 10,000 ft."
      - kind: light
        label: TAKEOFF CONFIG
        color: red
        x: 741
        "y": 43
        description: "When thrust went up for takeoff, an item such as the flaps, speedbrake, stabilizer trim or parking brake was not set for takeoff."
      - kind: light
        label: BELOW G/S
        color: amber
        x: 846
        "y": 43
        description: The airplane has gone well below the glideslope on the approach.
      - kind: light
        label: A/P
        color: amber
        x: 250
        "y": 88
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: A/T
        color: amber
        x: 307
        "y": 88
        description: "Autopilot, autothrottle and FMC alert light."
      - kind: light
        label: FMC
        color: amber
        x: 364
        "y": 88
        description: "Autopilot, autothrottle and FMC alert light."
  - id: fd
    title: First officer displays
    x: 1110
    "y": 119
    width: 430
    height: 226
    items:
      - kind: display_unit
        label: "INBOARD DU: ND"
        x: 110
        "y": 118
        controls:
          - fltinst
        description: Navigation display.
        width: 190
        height: 170
      - kind: display_unit
        label: "OUTBOARD DU: PFD"
        x: 320
        "y": 118
        controls:
          - fltinst
        description: Primary flight display.
        width: 190
        height: 170
  - id: clt
    title: Captain display select and lighting
    x: 10
    "y": 349
    width: 590
    height: 133
    items:
      - kind: selector
        label: MAIN PANEL
        x: 170
        "y": 34
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel brightness.
      - kind: selector
        label: PFD/MFD
        x: 263
        "y": 34
        controls:
          - dsel
        positions: "OUTBD, NORM, INBD"
        rest: "NORM"
        description: Moves the displays.
      - kind: selector
        label: BACKGROUND
        x: 359
        "y": 61
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Background brightness.
      - kind: selector
        label: AFDS FLOOD
        x: 471
        "y": 61
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Glareshield flood light.
      - kind: push_button
        label: FOOT AIR
        x: 39
        "y": 61
        description: Pull for foot air.
      - kind: push_button
        label: WINDSHIELD AIR
        x: 94
        "y": 61
        description: Pull for windshield air.
      - kind: selector
        label: OUTBD DU
        x: 170
        "y": 90
        description: Outboard display brightness.
      - kind: selector
        label: INBD DU
        x: 263
        "y": 90
        description: Inboard display brightness.
  - id: gp
    title: "Ground proximity, display select and air"
    x: 582
    "y": 486
    width: 619
    height: 118
    items:
      - kind: light
        label: GND PROX INOP
        color: amber
        x: 31
        "y": 30
        controls:
          - gpwssw
        description: "The ground proximity warning system has a fault, so terrain warnings may not work."
      - kind: push_button
        label: SYS TEST
        x: 31
        "y": 61
        controls:
          - gpwssw
        description: Runs the GPWS test.
      - kind: toggle_switch
        label: FLAP INHIBIT
        guarded: true
        x: 91
        "y": 57
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: GEAR INHIBIT
        guarded: true
        x: 154
        "y": 57
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: TERR INHIBIT
        guarded: true
        x: 216
        "y": 57
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: toggle_switch
        label: RUNWAY INHIBIT
        guarded: true
        x: 279
        "y": 57
        positions: NORM
        rest: "NORM"
        description: "Guarded at NORM. INHIBIT silences the flap, gear, terrain or runway alerts."
      - kind: selector
        label: PFD/MFD
        x: 355
        "y": 38
        controls:
          - dsel
        positions: "INBD, NORM, OUTBD"
        rest: "NORM"
        description: Moves the displays.
      - kind: selector
        label: MAIN PANEL
        x: 452
        "y": 38
        controls:
          - panellts
        positions: OFF to BRIGHT
        rest: "OFF to BRIGHT"
        description: Panel brightness.
      - kind: light
        label: RUNWAY INOP
        color: amber
        x: 31
        "y": 94
        description: Runway awareness is inoperative.
      - kind: selector
        label: INBD DU
        x: 355
        "y": 90
        description: Inboard display brightness and contrast.
      - kind: selector
        label: OUTBD DU
        x: 452
        "y": 90
        description: Outboard display brightness and contrast.
      - kind: push_button
        label: WINDSHIELD AIR
        x: 529
        "y": 63
        description: Pull for windshield air.
      - kind: push_button
        label: FOOT AIR
        x: 586
        "y": 63
        description: Pull for foot air.
