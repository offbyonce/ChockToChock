#
# yaml-language-server: $schema=../../../schemas/panel.schema.json
# Generated by tools/import-3x. Resting positions (`rest`) follow 3.0's defaults, corrected to
# 3.0's measured cold and dark panel state.
id: aft
title: Aft overhead
width: 1000
height: 488
sections:
  - id: elt
    title: ELT
    x: 8
    "y": 206
    width: 228
    height: 86
    items:
      - kind: light
        label: ELT
        color: amber
        x: 50
        "y": 46
        controls:
          - elt
        description: The emergency locator transmitter is sending a distress signal.
      - kind: toggle_switch
        label: ELT SWITCH
        guarded: true
        x: 150
        "y": 44
        controls:
          - elt
        positions: "ARM, ON"
        rest: "ARM"
        description: Emergency locator transmitter. Stays guarded.
  - id: le
    title: LE devices
    x: 8
    "y": 296
    width: 228
    height: 98
    items:
      - kind: display_unit
        label: LE FLAPS AND SLATS
        x: 114
        "y": 38
        description: "Shows leading edge device position: transit, extended or full extended."
        width: 190
        height: 46
      - kind: push_button
        label: TEST
        x: 114
        "y": 82
        description: Tests the leading edge device lights.
  - id: irs
    title: IRS
    x: 238
    "y": 70
    width: 230
    height: 326
    items:
      - kind: display_unit
        label: IRS DISPLAY
        x: 115
        "y": 24
        description: Shows the data chosen on DSPL SEL.
        width: 210
        height: 22
      - kind: selector
        label: DSPL SEL
        x: 58
        "y": 82
        positions: "TEST, TK/GS, PPOS, WIND, HDG/STS"
        rest: "TEST"
        description: Chooses what the IRS display shows.
      - kind: selector
        label: SYS DSPL
        x: 58
        "y": 140
        positions: "L, R"
        rest: "L"
        description: Chooses the left or right IRS.
      - kind: display_unit
        label: KEYPAD
        x: 165
        "y": 110
        description: Enters position and heading.
        width: 80
        height: 80
      - kind: light
        label: GPS
        color: amber
        x: 50
        "y": 190
        controls:
          - gpslts
        description: Both GPS receivers have failed. A failure of only one shows only on MASTER CAUTION recall.
      - kind: light
        label: ILS
        color: amber
        x: 115
        "y": 190
        controls:
          - gpslts
        description: "Both ILS receivers have failed, so the localizer and glideslope are not usable. A failure of only one shows only on MASTER CAUTION recall."
      - kind: light
        label: GLS
        color: amber
        x: 180
        "y": 190
        controls:
          - gpslts
        description: "Both GLS receivers have failed, so satellite based landing guidance is not available. A single failure shows only on recall."
      - kind: light
        label: ALIGN
        color: amber
        x: 36
        "y": 220
        controls:
          - irs
        description: "The left IRS is still finding its position and heading, so the airplane must stay still."
      - kind: light
        label: ON DC
        color: amber
        x: 82
        "y": 220
        controls:
          - irs
        description: "Left IRS is on DC power. Running on the battery, it drains if left on."
      - kind: light
        label: FAULT
        color: amber
        x: 36
        "y": 244
        controls:
          - irs
        description: The left IRS has a fault and its attitude or navigation data may be lost.
      - kind: light
        label: DC FAIL
        color: amber
        x: 82
        "y": 244
        controls:
          - irs
        description: The left IRS has lost its battery backup.
      - kind: light
        label: ALIGN
        color: amber
        x: 148
        "y": 220
        controls:
          - irs
        description: "The right IRS is still finding its position and heading, so the airplane must stay still."
      - kind: light
        label: ON DC
        color: amber
        x: 194
        "y": 220
        controls:
          - irs
        description: "Right IRS is on DC power. Running on the battery, it drains if left on."
      - kind: light
        label: FAULT
        color: amber
        x: 148
        "y": 244
        controls:
          - irs
        description: The right IRS has a fault and its attitude or navigation data may be lost.
      - kind: light
        label: DC FAIL
        color: amber
        x: 194
        "y": 244
        controls:
          - irs
        description: The right IRS has lost its battery backup.
      - kind: selector
        label: IRS L
        x: 60
        "y": 294
        controls:
          - irs
        positions: "OFF, ALIGN, NAV, ATT"
        rest: "OFF"
        description: Left IRS mode.
      - kind: selector
        label: IRS R
        x: 170
        "y": 294
        controls:
          - irs
        positions: "OFF, ALIGN, NAV, ATT"
        rest: "OFF"
        description: Right IRS mode.
  - id: svc
    title: Service interphone
    x: 470
    "y": 220
    width: 96
    height: 90
    items:
      - kind: toggle_switch
        label: SERVICE INTERPHONE
        x: 48
        "y": 46
        positions: "OFF, ON"
        rest: "OFF"
        description: Connects the service interphone.
  - id: aud3
    title: Observer audio panel
    x: 570
    "y": 6
    width: 226
    height: 172
    items:
      - kind: display_unit
        label: AUDIO CONTROL PANEL 3
        x: 113
        "y": 90
        description: Observer audio panel.
        width: 190
        height: 120
  - id: eng
    title: Engine
    x: 570
    "y": 182
    width: 226
    height: 94
    items:
      - kind: light
        label: REVERSER COMMAND
        color: amber
        x: 90
        "y": 20
        description: "In flight, a reverse thrust lever is not fully down."
      - kind: light
        label: REVERSER AIR/GRD
        color: amber
        x: 140
        "y": 20
        description: The air/ground logic used by the thrust reversers has failed.
      - kind: light
        label: REVERSER LIMITED
        color: amber
        x: 28
        "y": 48
        controls:
          - eec
        description: "A thrust reverser fault. In flight it means that reverser may not deploy, or reverse is limited to idle."
      - kind: light
        label: ENGINE CONTROL
        color: amber
        x: 28
        "y": 76
        controls:
          - eec
        description: "Engine control fault, not dispatchable. Only shows with the engine running on the ground."
      - kind: light
        label: REVERSER LIMITED
        color: amber
        x: 198
        "y": 48
        controls:
          - eec
        description: "A thrust reverser fault. In flight it means that reverser may not deploy, or reverse is limited to idle."
      - kind: light
        label: ENGINE CONTROL
        color: amber
        x: 198
        "y": 76
        controls:
          - eec
        description: "Engine control fault, not dispatchable. Only shows with the engine running on the ground."
      - kind: push_button
        label: EEC 1
        x: 90
        "y": 62
        controls:
          - eec
        positions: "ON, ALTN"
        rest: "ON"
        description: Engine 1 control. ON is normal. ALTN shows alternate mode.
        width: 40
      - kind: push_button
        label: EEC 2
        x: 140
        "y": 62
        controls:
          - eec
        positions: "ON, ALTN"
        rest: "ON"
        description: Engine 2 control. ON is normal. ALTN shows alternate mode.
        width: 40
  - id: oxy
    title: Oxygen
    x: 570
    "y": 280
    width: 226
    height: 114
    items:
      - kind: gauge
        label: CREW OXYGEN
        x: 56
        "y": 60
        controls:
          - crewoxy
        description: Crew oxygen pressure.
      - kind: toggle_switch
        label: PASS OXYGEN
        guarded: true
        x: 186
        "y": 46
        controls:
          - paxoxy
        positions: "NORMAL, ON"
        rest: "NORMAL"
        description: Drops the cabin masks. Guarded.
      - kind: light
        label: PASS OXY ON
        color: amber
        x: 136
        "y": 94
        controls:
          - paxoxy
        description: The passenger masks have dropped and oxygen is flowing in the cabin.
  - id: bb
    title: Broadband system
    x: 800
    "y": 112
    width: 192
    height: 66
    items:
      - kind: toggle_switch
        label: BROADBAND
        x: 70
        "y": 34
        positions: "OFF, ON, CREW ONLY"
        rest: "OFF"
        description: Cabin broadband power.
  - id: rec
    title: Flight recorder and Mach test
    x: 800
    "y": 182
    width: 192
    height: 94
    items:
      - kind: toggle_switch
        label: FLIGHT RECORDER
        guarded: true
        x: 44
        "y": 42
        controls:
          - fltrec
        positions: "TEST, NORMAL"
        rest: "NORMAL"
        description: Guarded. Runs automatically.
      - kind: light
        label: "OFF"
        color: amber
        x: 104
        "y": 66
        controls:
          - fltrec
        description: The flight data recorder is not recording.
      - kind: push_button
        label: MACH TEST 1
        x: 146
        "y": 52
        controls:
          - mach
        description: Tests the overspeed clacker.
        height: 24
      - kind: push_button
        label: MACH TEST 2
        x: 176
        "y": 52
        controls:
          - mach
        description: Tests the overspeed clacker.
        height: 24
  - id: stall
    title: Stall warning test
    x: 800
    "y": 280
    width: 192
    height: 56
    items:
      - kind: push_button
        label: STALL TEST 1
        x: 64
        "y": 26
        controls:
          - stalltest
        description: Tests the left stick shaker.
      - kind: push_button
        label: STALL TEST 2
        x: 128
        "y": 26
        controls:
          - stalltest
        description: Tests the right stick shaker.
  - id: jam
    title: Elevator jam
    x: 60
    "y": 400
    width: 156
    height: 82
    items:
      - kind: light
        label: ASSIST ON
        color: amber
        x: 44
        "y": 46
        controls:
          - elevjam
        description: Not simulated.
      - kind: toggle_switch
        label: ELEV JAM LANDING ASSIST
        guarded: true
        x: 116
        "y": 42
        controls:
          - elevjam
        positions: "OFF, ON"
        rest: "OFF"
        description: Not simulated.
  - id: mnt
    title: Maintenance
    x: 218
    "y": 400
    width: 250
    height: 82
    items:
      - kind: light
        label: MAINT
        color: amber
        x: 44
        "y": 46
        controls:
          - gpslts
        description: Not simulated.
  - id: dome
    title: Dome light
    x: 472
    "y": 400
    width: 96
    height: 82
    items:
      - kind: toggle_switch
        label: DOME WHITE
        x: 44
        "y": 40
        positions: "DIM, OFF, BRIGHT"
        rest: "OFF"
        description: Flight deck dome light.
  - id: gear
    title: Gear lights
    x: 572
    "y": 400
    width: 220
    height: 82
    items:
      - kind: light
        label: LEFT GEAR
        color: green
        x: 50
        "y": 26
        controls:
          - gearovhd
        description: The left main gear is down and locked. This is the second set of gear lights.
      - kind: light
        label: RIGHT GEAR
        color: green
        x: 102
        "y": 26
        controls:
          - gearovhd
        description: The right main gear is down and locked. This is the second set of gear lights.
      - kind: light
        label: NOSE GEAR
        color: green
        x: 76
        "y": 58
        controls:
          - gearovhd
        description: The nose gear is down and locked. This is the second set of gear lights.
