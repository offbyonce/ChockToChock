<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Geist, system-ui, sans-serif">
  <dc-import name="Checklist" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

  <nav aria-label="Menu" style="position: absolute; left: 0; top: 0; bottom: 0; width: 360px; box-sizing: border-box; background: {{t.surface}}; border-right: 1px solid {{t.border}}; box-shadow: 24px 0 48px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column">
    <div style="height: 60px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 20px; border-bottom: 1px solid {{t.line}}">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 600; font-size: 16px">Chock to Chock</span><span style="font-size: 12px; color: {{t.muted}}">iFly 737 MAX 8 · saved 10:14</span></div>
      <a href="Checklist.dc.html" aria-label="Close menu" style="width: 44px; height: 44px; color: {{t.sub}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">Steps</span>
        <div style="display: flex; background: {{t.segTrack}}; border: 1px solid {{t.segBorder}}; border-radius: 12px; padding: 2px">
          <button aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: {{t.segOn}}; box-shadow: inset 0 0 0 1.5px {{t.accent}}, {{t.segShadow}}; color: {{t.strong}}; font: inherit; font-size: 14px; font-weight: 600">Full</button>
          <button aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: transparent; color: {{t.muted}}; font: inherit; font-size: 14px">Essentials</button>
        </div>
        <div style="display: flex; background: {{t.segTrack}}; border: 1px solid {{t.segBorder}}; border-radius: 12px; padding: 2px">
          <button aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: {{t.segOn}}; box-shadow: inset 0 0 0 1.5px {{t.accent}}, {{t.segShadow}}; color: {{t.strong}}; font: inherit; font-size: 14px; font-weight: 600">Detailed</button>
          <button aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: transparent; color: {{t.muted}}; font: inherit; font-size: 14px">Simple</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}; padding: 0 8px 4px">Learn</span>
        <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">Practice</a>
        <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">How procedures work</a>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}; padding: 0 8px 4px">Reference</span>
        <a href="Deck.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">Flight deck<span style="font-size: 12px; color: {{t.muted}}">Panels and lights</span></a>
        <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">Glossary</a>
        <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">References</a>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}; padding: 0 8px 4px">This flight and the app</span>
        <a href="Log.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">Flight log</a>
        <a href="Settings.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">Settings</a>
        <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.text}}; text-decoration: none; font-size: 16px">Take the tour</a>
      </div>
      <div style="flex: 1"></div>
      <div style="height: 1px; background: {{t.line}}; margin: 0 4px"></div>
      <button style="min-height: 52px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 6px 12px; border: 0; border-radius: 10px; background: transparent; color: {{t.redText}}; font: inherit; text-align: left">
        <span style="font-size: 16px; font-weight: 600">Reset flight plan</span>
        <span style="font-size: 12px; color: {{t.muted}}">Clears the plan, clearance and notes. Undo right after.</span>
      </button>
      <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: {{t.link}}; text-decoration: none">Where is Flight setup? ⌄</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      dark: { bg: '#0f1218', surface: '#121720', border: '#2a323e', line: '#222934', text: '#e6e9ee', sub: '#b7bec9', muted: '#8b94a3', strong: '#ffffff', accent: '#4c8dff', link: '#7fb0ff', redText: '#ff8a7a', segTrack: '#0f1218', segBorder: '#2a323e', segOn: '#2a323e', segShadow: '0 0 0 0 transparent', scrim: 'rgba(6, 8, 12, 0.55)' },
      light: { bg: '#f5f7fa', surface: '#ffffff', border: '#d3d9e1', line: '#e2e6ec', text: '#1a1f27', sub: '#3d4552', muted: '#5b6472', strong: '#0b0f14', accent: '#2563eb', link: '#1d4fd8', redText: '#b3261e', segTrack: '#e6eaf0', segBorder: '#dde2e8', segOn: '#ffffff', segShadow: '0 1px 2px rgba(16, 24, 40, 0.14)', scrim: 'rgba(20, 26, 36, 0.35)' }
    };
    const th = this.props.theme === 'light' ? 'light' : 'dark';
    return { theme: th, t: T[th] };
  }
}
</script>
</body>
</html>
