<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flight strip opened</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: {{o.bg}}; color: {{o.text}}; font-family: Geist, system-ui, sans-serif">
  <dc-import name="Checklist" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 168px; bottom: 0; background: {{o.scrim}}"></div>

  <section aria-label="Flight strip" style="position: absolute; left: 0; right: 0; top: 120px; background: {{o.surface}}; border-bottom: 1px solid {{o.border}}; box-shadow: {{o.shadow}}">
    <div style="height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid {{o.line}}">
      <a href="Checklist.dc.html" aria-expanded="true" aria-label="Close the flight strip" style="flex: 1; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: {{o.text}}">
        <span style="font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">KSEA → KSFO</span>
        <span style="font-size: 14px; color: {{o.muted}}">Clearance and notes</span>
        <span style="flex: 1"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{o.sub}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </a>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 32px; padding: 16px 32px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: {{o.sub}}">Clearance</h2>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{o.muted}}">Runway<input value="16L" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: {{o.field}}; border: 1px solid {{o.border}}; border-radius: 8px; color: {{o.strong}}; font-family: 'Geist Mono', monospace; font-size: 15px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{o.muted}}">SID<input value="SUMMA2" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: {{o.field}}; border: 1px solid {{o.border}}; border-radius: 8px; color: {{o.strong}}; font-family: 'Geist Mono', monospace; font-size: 15px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{o.muted}}">Transition<input value="SEA" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: {{o.field}}; border: 1px solid {{o.border}}; border-radius: 8px; color: {{o.strong}}; font-family: 'Geist Mono', monospace; font-size: 15px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{o.muted}}">Initial altitude<input value="5000" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: {{o.field}}; border: 1px solid {{o.border}}; border-radius: 8px; color: {{o.strong}}; font-family: 'Geist Mono', monospace; font-size: 15px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{o.muted}}">Squawk<input value="4521" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: {{o.field}}; border: 1px solid {{o.border}}; border-radius: 8px; color: {{o.strong}}; font-family: 'Geist Mono', monospace; font-size: 15px"></label>
        </div>
        <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; align-self: flex-start; font-size: 14px; color: {{o.link}}; text-decoration: none">Frequencies: ground, tower, departure ⌄</a>
      </div>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: {{o.sub}}">Notes from ATC
        <textarea style="flex: 1; min-height: 100px; box-sizing: border-box; padding: 10px 12px; background: {{o.field}}; border: 1px solid {{o.border}}; border-radius: 8px; color: {{o.strong}}; font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 400; line-height: 1.5; resize: none">Expect FL370 ten minutes after departure</textarea>
      </label>
    </div>

    <div style="height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 32px; border-top: 1px solid {{o.line}}">
      <button style="height: 44px; padding: 0 14px; border: 1px solid {{o.border}}; border-radius: 10px; background: {{o.btnBg}}; box-shadow: {{o.btnShadow}}; color: {{o.text}}; font: inherit; font-size: 14px; font-weight: 600">Import latest from SimBrief</button>
      <span style="font-size: 12px; color: {{o.muted}}">Runway and SID from SimBrief, 10:02 · the rest typed</span>
      <span style="flex: 1"></span>
      <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{o.redText}}; font: inherit; font-size: 14px">Reset flight plan</button>
      <a href="SimBrief.dc.html" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 16px; font-weight: 600; color: {{o.link}}; text-decoration: none">All flight data<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const O = {
      dark: { bg: '#0f1218', surface: '#121720', field: '#0f1218', border: '#2f3846', line: '#222934', text: '#e6e9ee', sub: '#b7bec9', muted: '#8b94a3', strong: '#ffffff', link: '#7fb0ff', redText: '#ff8a7a', btnBg: 'transparent', btnShadow: 'none', scrim: 'rgba(6, 8, 12, 0.5)', shadow: '0 20px 40px rgba(0, 0, 0, 0.45)' },
      light: { bg: '#f5f7fa', surface: '#ffffff', field: '#ffffff', border: '#c9d0d9', line: '#e2e6ec', text: '#1a1f27', sub: '#3d4552', muted: '#5b6472', strong: '#0b0f14', link: '#1d4fd8', redText: '#b3261e', btnBg: '#ffffff', btnShadow: '0 1px 2px rgba(16, 24, 40, 0.10)', scrim: 'rgba(20, 26, 36, 0.3)', shadow: '0 20px 40px rgba(16, 24, 40, 0.16)' }
    };
    const th = this.props.theme === 'light' ? 'light' : 'dark';
    return { theme: th, o: O[th] };
  }
}
</script>
</body>
</html>
