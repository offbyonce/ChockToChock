# SPDX-FileCopyrightText: 2026 offbyonce
# SPDX-License-Identifier: MIT
#
# Licenses for files that cannot carry a comment header. Code is MIT; checklist
# content in packs/ and the pack snapshots in crates/pack-cli/tests/snapshots/ is
# CC BY-NC-SA 4.0. Check with `reuse lint` (https://reuse.software).
version = 1

[[annotations]]
path = [
    "**/*.json",
    "**/*.webmanifest",
    "**/*.lock",
    "pnpm-lock.yaml",
    "**/*.snap",
    "**/*.png",
    "**/*.ico",
    "**/*.icns",
    "packages/bindings/src/generated/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["packs/**", "crates/pack-cli/tests/snapshots/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 offbyonce and Chock to Chock contributors"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

[[annotations]]
path = ["apps/web/src/fonts/*.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2012 The B612 Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Tabler icons, copied unmodified (only the ones the interface uses). MIT requires keeping the
# upstream copyright notice, which names its author; AGENTS.md allows such required notices.
[[annotations]]
path = ["packages/ui/src/icons/tabler/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Paweł Kuna"
SPDX-License-Identifier = "MIT"
